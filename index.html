  <script>
    // 매니페스트를 동적으로 생성해 링크 태그 주입
    const manifest = {
      name: "WealthOS 통합 자산관리",
      short_name: "WealthOS",
      description: "주식·연금·부동산·차량·VIX 공포지수 통합 자산관리",
      start_url: "./",
      display: "standalone",
      background_color: "#070d1a",
      theme_color: "#070d1a",
      orientation: "portrait",
      icons: [
        { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23070d1a'/><text y='68' x='50' text-anchor='middle' font-size='60'>📊</text></svg>", sizes: "192x192", type: "image/svg+xml" },
        { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23070d1a'/><text y='68' x='50' text-anchor='middle' font-size='60'>📊</text></svg>", sizes: "512x512", type: "image/svg+xml" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const url  = URL.createObjectURL(blob);

    link.rel   = 'manifest'; link.href = url;
    document.head.appendChild(link);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <style>
/* ═══════════════════════ RESET & VARS ═══════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070d1a;--s1:#0d1828;--s2:#111e33;--s3:#16253e;
  --b1:rgba(80,140,255,.10);--b2:rgba(80,140,255,.22);
  --acc:#4f80ff;--acc2:#7eb8ff;
  --g:#34d399;--r:#f87171;--y:#fbbf24;--p:#a78bfa;
  --tx:#ddeeff;--tx2:#7a99cc;--tx3:#3a5070;
  --nav:64px;--top:52px;
  --rad:12px;--rad-s:8px;
  --mono:'DM Mono',monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html,body{
  background:var(--bg);color:var(--tx);
  font-family:'Noto Sans KR',sans-serif;
  font-size:14px;line-height:1.5;
  height:100%;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

/* ═══════════════════════ LAYOUT ═══════════════════════ */
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;}

/* Topbar */
#topbar{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:100;
  height:calc(var(--top) + var(--safe-t));
  padding-top:var(--safe-t);
  background:rgba(7,13,26,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--b1);
  display:flex;align-items:center;padding-left:16px;padding-right:16px;gap:10px;
}
.logo{font-size:17px;font-weight:900;color:var(--acc2);letter-spacing:-.4px;flex:1;}
.topbar-time{font-family:var(--mono);font-size:10px;color:var(--tx3);}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--g);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.icon-btn{background:none;border:none;cursor:pointer;font-size:19px;padding:4px 6px;color:var(--tx3);line-height:1;}

/* Scroll area */
#scroll{
  position:fixed;
  top:calc(var(--top) + var(--safe-t));
  bottom:calc(var(--nav) + var(--safe-b));
  left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 12px 8px;
}

/* Tabbar */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:100;
  background:rgba(7,13,26,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--b1);
  display:flex;align-items:flex-start;
  padding-top:8px;
  padding-bottom:calc(8px + var(--safe-b));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:0 2px;}
.tab-ico{font-size:21px;transition:transform .15s;}
.tab-lbl{font-size:9.5px;font-weight:700;color:var(--tx3);transition:color .15s;white-space:nowrap;}
.tab.on .tab-ico{transform:scale(1.15);}
.tab.on .tab-lbl{color:var(--acc2);}
.tab-bdg{
  position:absolute;top:-3px;right:-6px;
  background:var(--r);color:#fff;font-size:8px;font-weight:900;
  border-radius:8px;padding:1px 5px;min-width:14px;text-align:center;
}

/* ═══════════════════════ CARDS ═══════════════════════ */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rad);padding:16px;margin-bottom:12px;}
.card-sm{padding:12px 14px;}
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:12px;}

/* Horizontal scroll */
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -12px;padding-left:12px;padding-right:12px;}
.hrow::-webkit-scrollbar{display:none;}
.hcard{
  min-width:128px;flex-shrink:0;
  background:var(--s1);border:1px solid var(--b1);
  border-radius:var(--rad);padding:13px;position:relative;overflow:hidden;
}
.hcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--hc,var(--acc));}
.hc-lbl{font-size:9.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.hc-val{font-size:16px;font-weight:900;font-family:var(--mono);}
.hc-sub{font-size:10px;color:var(--tx3);margin-top:3px;}

/* Stamp */
.stamp{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;color:var(--tx3);background:var(--s2);padding:2px 7px;border-radius:4px;border:1px solid var(--b1);}

/* ═══════════════════════ TABLE ═══════════════════════ */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;padding:5px 7px;border-bottom:1px solid var(--b1);text-align:left;}
.tbl td{padding:8px 7px;border-bottom:1px solid rgba(80,140,255,.05);font-size:12px;vertical-align:middle;}
.tbl tr:last-child td{border:none;}

/* ═══════════════════════ TAGS ═══════════════════════ */
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.buy{background:rgba(52,211,153,.14);color:#34d399;border:1px solid rgba(52,211,153,.2);}
.sell{background:rgba(248,113,113,.14);color:#f87171;border:1px solid rgba(248,113,113,.2);}
.hold{background:rgba(251,191,36,.14);color:#fbbf24;border:1px solid rgba(251,191,36,.2);}
.watch{background:rgba(167,139,250,.14);color:#a78bfa;border:1px solid rgba(167,139,250,.2);}
.up{color:#34d399;}.dn{color:#f87171;}.dim{color:var(--tx3);}

/* ═══════════════════════ BUTTONS ═══════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:11px 16px;border-radius:var(--rad-s);font-size:13px;font-weight:700;
  cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;
  transition:opacity .12s,transform .12s;user-select:none;}
.btn:active{opacity:.7;transform:scale(.97);}
.btn-p{background:var(--acc);color:#fff;}
.btn-g{background:transparent;border:1px solid var(--b2);color:var(--tx2);}
.btn-gr{background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.2);color:#34d399;}
.btn-rd{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.2);color:#f87171;}
.btn-w{width:100%;}
.btn-sm{padding:7px 12px;font-size:11.5px;}
.btn-xs{padding:4px 9px;font-size:10.5px;}

/* ═══════════════════════ FORM ═══════════════════════ */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:5px;}
.fi,.fs{
  width:100%;background:var(--s2);border:1px solid var(--b2);
  border-radius:var(--rad-s);padding:12px 13px;color:var(--tx);
  font-size:14px;font-family:'Noto Sans KR',sans-serif;
  outline:none;-webkit-appearance:none;appearance:none;
}
.fi:focus,.fs:focus{border-color:var(--acc);}
.fs option{background:var(--s2);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ═══════════════════════ DRAWER ═══════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;backdrop-filter:blur(4px);animation:fadein .18s;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.drawer{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--s1);border-radius:18px 18px 0 0;
  z-index:201;padding:0 16px;
  max-height:88vh;overflow-y:auto;
  animation:slideup .25s cubic-bezier(.34,1.2,.64,1);
  padding-bottom:calc(20px + var(--safe-b));
}
@keyframes slideup{from{transform:translate(-50%,100%);}to{transform:translate(-50%,0);}}
.dhandle{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:12px auto 16px;}
.dtitle{font-size:16px;font-weight:900;margin-bottom:16px;}

/* ═══════════════════════ VIX ═══════════════════════ */
.vix-num{font-size:60px;font-weight:900;font-family:var(--mono);text-align:center;line-height:1;}
.vix-badge{font-size:13px;font-weight:700;padding:3px 14px;border-radius:20px;display:inline-block;margin-top:5px;}
.vix-bar{height:13px;border-radius:7px;background:linear-gradient(90deg,#00ffaa,#34d399 20%,#fbbf24 45%,#fb923c 70%,#ff4444);position:relative;margin:14px 0 5px;}
.vix-needle{position:absolute;top:-4px;width:4px;height:21px;border-radius:2px;background:#fff;transform:translateX(-50%);box-shadow:0 0 8px rgba(255,255,255,.7);transition:left .9s cubic-bezier(.34,1.4,.64,1);}
.vix-lbl{display:flex;justify-content:space-between;font-size:9px;color:var(--tx3);}
.vix-hist{display:flex;align-items:flex-end;gap:3px;height:38px;margin-top:10px;}
.vh-bar{flex:1;border-radius:2px 2px 0 0;}

/* ═══════════════════════ REBAL BAR ═══════════════════════ */
.rb-wrap{margin-bottom:12px;}
.rb-head{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;}
.rb-track{height:6px;background:var(--s3);border-radius:3px;position:relative;overflow:visible;}
.rb-fill{height:100%;border-radius:3px;transition:width .5s;}
.rb-tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.5);border-radius:1px;}

/* ═══════════════════════ MISC ═══════════════════════ */
.prog{height:5px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:8px;}
.prog-f{height:100%;border-radius:3px;transition:width .5s;}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-title{font-size:15px;font-weight:900;}
.empty{text-align:center;padding:40px 16px;color:var(--tx3);}
.empty-ico{font-size:40px;margin-bottom:10px;}
.tabs-row{display:flex;gap:3px;background:var(--s2);border-radius:8px;padding:3px;margin-bottom:14px;}
.tab-pill{flex:1;text-align:center;padding:8px 4px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx2);transition:all .14s;}
.tab-pill.on{background:var(--s3);color:var(--tx);font-weight:700;}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--s3);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--acc);}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;}
.toggle.on::after{left:21px;}
.alert-item{display:flex;gap:10px;padding:10px 12px;border-radius:var(--rad-s);background:var(--s2);border-left:3px solid var(--b2);margin-bottom:8px;}
.spinner{width:16px;height:16px;border:2px solid rgba(79,128,255,.3);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.photo-drop{border:2px dashed var(--b2);border-radius:var(--rad);padding:26px 16px;text-align:center;cursor:pointer;transition:all .18s;}
.photo-drop.drag{border-color:var(--acc);background:rgba(79,128,255,.05);}
.photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--s2);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:none;color:#fff;border-radius:4px;padding:2px 6px;font-size:11px;cursor:pointer;}
.ai-box{background:var(--s2);border-radius:var(--rad-s);padding:12px 14px;margin-top:10px;font-size:12px;color:var(--tx2);line-height:1.6;}

@media(min-width:480px){
  #app,#topbar,#tabbar,#scroll,.drawer{border-left:1px solid var(--b1);border-right:1px solid var(--b1);}
  #scroll{max-width:480px;}
}
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">📊 WealthOS</div>
    <div class="pulse"></div>
    <div class="topbar-time" id="clock">--:--</div>
    <button class="icon-btn" onclick="goPage('settings')">⚙</button>
  </div>
  <div id="scroll"></div>
  <div id="tabbar"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   WealthOS PWA — 단일 HTML 파일 앱
   수정 방법: 이 파일을 편집기로 열어서 JS 부분 수정
   → 저장 → 브라우저 새로고침 (F5) → 즉시 반영
═══════════════════════════════════════════════════════ */

/* ── 1. 스토리지 ────────────────────────────────────── */
const DB = {
  get(k){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch{} },
  del(k){ try{localStorage.removeItem(k);}catch{} }
};

/* ── 2. 기본 데이터 ──────────────────────────────────── */
const DEFAULT = {
  vix:{value:28.4,prev:24.1,hist:[18,20,22,19,24,28,31,28,26,28],at:new Date().toISOString()},
  pension:{
    total:342000000,
    target:{ds:40,fs:30,bd:20,al:10},
    current:{ds:47,fs:28,bd:18,al:7},
    funds:[
      {id:1,name:"삼성 TDF 2040",type:"국내주식",amount:96500000,ytd:8.4,signal:"hold"},
      {id:2,name:"미래에셋 글로벌",type:"해외주식",amount:74200000,ytd:12.1,signal:"buy"},
      {id:3,name:"한국채권인덱스",type:"채권",amount:52800000,ytd:2.3,signal:"hold"},
      {id:4,name:"KB리츠혼합",type:"대안",amount:18500000,ytd:-1.2,signal:"watch"},
    ],at:new Date().toISOString()
  },
  stocks:[
    {id:1,ticker:"005930",name:"삼성전자",qty:400,avg:68500,cur:74200,signal:"buy"},
    {id:2,ticker:"000660",name:"SK하이닉스",qty:150,avg:142000,cur:188500,signal:"hold"},
    {id:3,ticker:"035420",name:"NAVER",qty:80,avg:195000,cur:178000,signal:"buy"},
    {id:4,ticker:"051910",name:"LG화학",qty:60,avg:340000,cur:298000,signal:"sell"},
  ],
  realestate:[
    {id:1,name:"강남구 아파트",type:"아파트",buy:1200000000,cur:1380000000,signal:"hold",ryd:2.8},
    {id:2,name:"판교 오피스텔",type:"오피스텔",buy:280000000,cur:265000000,signal:"watch",ryd:4.2},
  ],
  vehicles:[
    {id:1,name:"BMW 5시리즈",year:2022,buy:72000000,cur:58000000,km:38000,signal:"hold"},
    {id:2,name:"테슬라 모델Y",year:2023,buy:62000000,cur:52000000,km:22000,signal:"hold"},
  ],
  cash:150000000,
  at:new Date().toISOString()
};

/* ── 3. 상태 ─────────────────────────────────────────── */
let S = DB.get("wo_data") || JSON.parse(JSON.stringify(DEFAULT));
let currentPage = "home";

function save(){ DB.set("wo_data",S); }
function ts(){ return new Date().toISOString(); }
function now(){ return new Date(); }

/* ── 4. 유틸 ─────────────────────────────────────────── */
const N  = n => new Intl.NumberFormat("ko-KR").format(n);
const B  = n => n>=1e8?(n/1e8).toFixed(1)+"억":n>=1e4?(n/1e4).toFixed(0)+"만":N(n);
const DT = d => { const x=new Date(d); return x.toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit"})+" "+x.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}); };
const DF = d => new Date(d).toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"});
const PL = (a,c) => (((c-a)/a)*100).toFixed(1);
const esc= s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ── 5. VIX 구간 ─────────────────────────────────────── */
const VZ = [
  {min:0, max:15, name:"극도 탐욕", col:"#00ffaa", act:["주식 20% 축소","채권·현금 확대","고평가 매도"]},
  {min:15,max:20, name:"탐욕",     col:"#34d399", act:["주식 10% 축소","배당주 유지","현금 20%+"]},
  {min:20,max:25, name:"중립",     col:"#fbbf24", act:["현 포지션 유지","분기 점검만","보수적 진입"]},
  {min:25,max:35, name:"공포",     col:"#fb923c", act:["분할 매수 시작","우량주 집중","연금 주식+5%"]},
  {min:35,max:99, name:"극도 공포",col:"#ff4444", act:["적극 저점 매수","ETF 집중 매수","주식 +20%"]},
];
const GZ = v => VZ.find(z=>v>=z.min&&v<z.max)||VZ[4];

function tag(s){
  const m={buy:["매수","buy"],sell:["매도","sell"],hold:["보유","hold"],watch:["관망","watch"]};
  const[l,c]=m[s]||["—",""];
  return `<span class="tag ${c}">${l}</span>`;
}

/* ── 6. 탭바 렌더 ────────────────────────────────────── */
const TABS=[
  {id:"home",ico:"◉",lbl:"홈"},
  {id:"vix",ico:"😱",lbl:"공포지수"},
  {id:"pension",ico:"🏦",lbl:"연금"},
  {id:"stocks",ico:"📈",lbl:"주식"},
  {id:"assets",ico:"🏠",lbl:"자산"},
  {id:"input",ico:"✏️",lbl:"입력"},
];

function renderTabbar(){
  const el = document.getElementById("tabbar");
  el.innerHTML = TABS.map(t=>`
    <div class="tab ${currentPage===t.id?"on":""}" onclick="goPage('${t.id}')">
      <div style="position:relative;display:inline-block;">
        <div class="tab-ico">${t.ico}</div>
      </div>
      <div class="tab-lbl">${t.lbl}</div>
    </div>`).join("");
}

function goPage(p){ currentPage=p; renderTabbar(); renderPage(); window.scrollTo(0,0); document.getElementById("scroll").scrollTop=0; }

/* ── 7. 페이지 라우터 ────────────────────────────────── */
function renderPage(){
  const el = document.getElementById("scroll");
  const pages = {home:pageHome,vix:pageVix,pension:pagePension,stocks:pageStocks,assets:pageAssets,input:pageInput,settings:pageSettings};
  el.innerHTML = (pages[currentPage]||pageHome)();
  bindEvents();
}

/* ── 8. 이벤트 바인딩 ────────────────────────────────── */
function bindEvents(){
  // 모든 data-fn 속성을 찾아 클릭 이벤트 바인딩
  document.querySelectorAll("[data-fn]").forEach(el=>{
    el.addEventListener("click", e => {
      e.stopPropagation();
      const fn = el.getAttribute("data-fn");
      const arg= el.getAttribute("data-arg");
      if(window[fn]) window[fn](arg);
    });
  });
  // 드로어 오버레이 클릭 닫기
  document.querySelectorAll(".overlay").forEach(el=>{
    el.addEventListener("click", e => { if(e.target===el) closeDrawer(); });
  });
}

function closeDrawer(){
  const d=document.getElementById("active-drawer");
  if(d) d.remove();
}

function openDrawer(html){
  closeDrawer();
  const d=document.createElement("div");
  d.id="active-drawer";
  d.innerHTML=`<div class="overlay"><div class="drawer"><div class="dhandle"></div>${html}</div></div>`;
  document.body.appendChild(d);
  d.querySelector(".overlay").addEventListener("click",e=>{if(e.target===d.querySelector(".overlay"))closeDrawer();});
}

function bindPhotoEvents(){
  const fi=document.getElementById("photo-file");
  const drop=document.getElementById("photo-drop");
  if(!fi||!drop) return;
  fi.addEventListener("change",e=>addPhotos(e.target.files));
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag");});
  drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
  drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("drag");addPhotos(e.dataTransfer.files);});
}

function addPhotos(files){
  photoFiles=[...photoFiles,...Array.from(files)].slice(0,6);
  renderPhotoPreview();
}

function renderPhotoPreview(){
  const prev=document.getElementById("photo-preview");
  const acts=document.getElementById("photo-actions");
  if(!prev) return;
  if(photoFiles.length===0){prev.innerHTML="";if(acts)acts.innerHTML="";return;}
  prev.innerHTML=`<div class="photo-grid">${photoFiles.map((f,i)=>`
    <div class="photo-thumb"><img src="${URL.createObjectURL(f)}" alt=""/>
      <button class="photo-del" onclick="removePhoto(${i})">✕</button>
    </div>`).join("")}</div>`;
  if(acts) acts.innerHTML=`<div style="display:flex;gap:8px;margin-top:10px;">
    <button class="btn btn-p btn-w" onclick="analyzePhoto()">🤖 AI 자동 분석</button>
    <button class="btn btn-g btn-xs" onclick="photoFiles=[];renderPhotoPreview()">초기화</button>
  </div>`;
}

window.removePhoto = i => { photoFiles.splice(i,1); renderPhotoPreview(); };

window.analyzePhoto = async function(){
  if(!photoFiles.length) return;
  const res=document.getElementById("photo-result");
  if(res) res.innerHTML=`<div class="ai-box" style="display:flex;align-items:center;gap:8px;"><div class="spinner"></div><span>Claude AI 분석 중...</span></div>`;
  try{
    const b64=await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=fail;r.readAsDataURL(photoFiles[0]);});
    const mime=photoFiles[0].type||"image/jpeg";
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      model:"claude-sonnet-4-20250514",max_tokens:800,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:mime,data:b64}},
        {type:"text",text:`금융 문서 이미지입니다. JSON만 출력:
{"asset_type":"주식|연금|부동산|차량|예금|기타","asset_name":"자산명","amount":숫자,"date":"YYYY-MM-DD","details":"요약","items":[{"k":"항목","v":"값"}]}`}
      ]}]
    })});
    const d=await resp.json();
    const txt=d.content?.find(c=>c.type==="text")?.text||"{}";
    let r; try{r=JSON.parse(txt.replace(/```json|```/g,"").trim());}catch{r={details:txt};}
    if(res) res.innerHTML=`<div class="ai-box">
      <div style="font-size:10px;font-weight:700;color:var(--tx3);margin-bottom:8px;">🤖 AI 분석 결과</div>
      ${r.asset_type?`<div><b>유형:</b> ${esc(r.asset_type)}</div>`:""}
      ${r.asset_name?`<div><b>자산:</b> ${esc(r.asset_name)}</div>`:""}
      ${r.amount?`<div><b>금액:</b> <span style="font-family:var(--mono);">${N(r.amount)}원</span></div>`:""}
      ${r.date?`<div><b>날짜:</b> ${esc(r.date)}</div>`:""}
      ${r.details?`<div style="color:var(--tx3);margin-top:4px;">${esc(r.details)}</div>`:""}
      ${(r.items||[]).map(it=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:2px;"><span style="color:var(--tx3);">${esc(it.k)}</span><span style="font-family:var(--mono);">${esc(it.v)}</span></div>`).join("")}
    </div>`;
  }catch(e){
    if(res) res.innerHTML=`<div class="ai-box" style="color:var(--r);">API 오류 — 수동 입력해 주세요</div>`;
  }
};

    </div>
  </div>
  <div class="card" style="margin-bottom:12px;">
    <div class="card-title">💾 저장 현황</div>
    <div class="stat-row"><span class="stat-label">마지막 저장</span><span class="stat-val" style="font-size:12px;">${DF(S.at)}</span></div>
    <div class="stat-row"><span class="stat-label">저장 위치</span><span class="stat-val" style="font-size:11px;">기기 로컬 (localStorage)</span></div>
    <div class="stat-row"><span class="stat-label">보유 종목</span><span class="stat-val">${S.stocks.length}개</span></div>
    <div class="stat-row"><span class="stat-label">연금 펀드</span><span class="stat-val">${S.pension.funds.length}개</span></div>

    <div class="fg"><label class="fl">새 비밀번호 (4자 이상)</label><input class="fi" type="password" id="pw-new"/></div>

window.exportData = () => {
  const a=document.createElement("a");
  a.href="data:application/json,"+encodeURIComponent(JSON.stringify(S,null,2));
  a.download=`wealthos_${new Date().toISOString().split("T")[0]}.json`;
  a.click();
};
window.importData = e => {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{try{S=JSON.parse(ev.target.result);save();renderPage();alert("가져오기 완료!");}catch{alert("파일 오류");}};
  r.readAsText(f);
};

/* ══════════════════════════════════════════════════════
   시계 & 자동 갱신
══════════════════════════════════════════════════════ */
function updateClock(){
  const el=document.getElementById("clock");
  if(el) el.textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
}
setInterval(updateClock,1000);
setInterval(()=>{ S.at=ts(); save(); },60000);

/* ══════════════════════════════════════════════════════
   서비스 워커 (PWA 오프라인)
══════════════════════════════════════════════════════ */
if("serviceWorker" in navigator){
  const swCode=`
    self.addEventListener("install",e=>self.skipWaiting());
    self.addEventListener("activate",e=>clients.claim());
    self.addEventListener("fetch",e=>{
      if(e.request.url.includes("anthropic.com")) return;
      e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
        return caches.open("wo-v1").then(c=>{c.put(e.request,res.clone());return res;});
      })));
    });`;
  const blob=new Blob([swCode],{type:"application/javascript"});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

/* ════════════ 비밀번호 잠금 ════════════ */
function _pwGet(){ try{return localStorage.getItem("wo_pw")||"01234";}catch(e){return "01234";} }
function _pwSet(v){ try{localStorage.setItem("wo_pw",v);}catch(e){} }

function _lockShow(){
  var ov = document.createElement("div");
  ov.id = "_LK";
  ov.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#070d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:sans-serif;";
  ov.innerHTML =
    '<div style="font-size:48px;margin-bottom:8px">📊</div>' +
    '<div style="font-size:20px;font-weight:900;color:#7eb8ff;margin-bottom:4px">WealthOS</div>' +
    '<div style="font-size:11px;color:#3a5070;margin-bottom:32px">통합 자산관리</div>' +
    '<div style="width:100%;max-width:280px">' +
      '<input id="_PI" type="password" inputmode="numeric" placeholder="비밀번호" maxlength="20" style="width:100%;padding:14px;font-size:16px;background:#0d1828;color:#ddeeff;border:2px solid #4f80ff;border-radius:10px;text-align:center;outline:none;box-sizing:border-box;margin-bottom:10px"/>' +
      '<button id="_PB" style="width:100%;padding:14px;background:#4f80ff;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">잠금 해제</button>' +
      '<div id="_PE" style="color:#f87171;text-align:center;font-size:12px;margin-top:8px;min-height:16px"></div>' +
      '<div style="color:#3a5070;text-align:center;font-size:11px;margin-top:14px">초기 비밀번호: <b style="color:#7a99cc">01234</b></div>' +
    '</div>';
  document.body.appendChild(ov);

  var inp = document.getElementById("_PI");
  var btn = document.getElementById("_PB");
  var err = document.getElementById("_PE");
  var fail = 0;

  function check(){
    var v = (inp.value||"").trim();
    if(v === _pwGet()){
      ov.parentNode.removeChild(ov);
    } else {
      fail++;
      inp.value = "";
      inp.focus();
      err.textContent = fail >= 3 ? "잠시 후 재시도" : "비밀번호 오류 (" + fail + "/3)";
      if(fail >= 3){
        btn.disabled = true; btn.style.opacity = "0.4";
        setTimeout(function(){
          btn.disabled = false; btn.style.opacity = "1";
          fail = 0; err.textContent = "";
        }, 5000);
      }
    }
  }

  btn.addEventListener("click", check);
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter") check(); });
  setTimeout(function(){ inp.focus(); }, 200);
}

window.changePw = function(){
  var c = document.getElementById("pw-cur");
  var n = document.getElementById("pw-new");
  var n2 = document.getElementById("pw-new2");
  var m = document.getElementById("pw-msg");
  if(!c||!n||!n2||!m) return;
  if(c.value !== _pwGet()){ m.style.color="#f87171"; m.textContent="현재 비밀번호 오류"; return; }
  if(n.value.length < 4){ m.style.color="#f87171"; m.textContent="4자리 이상"; return; }
  if(n.value !== n2.value){ m.style.color="#f87171"; m.textContent="불일치"; return; }
  _pwSet(n.value);
  m.style.color="#34d399"; m.textContent="✅ 변경 완료";
  setTimeout(function(){ c.value=""; n.value=""; n2.value=""; m.textContent=""; }, 2000);
};

updateClock();
renderTabbar();
renderPage();
setTimeout(bindPhotoEvents, 100);
_lockShow();

</script>
