  closeDrawer();
  // 결과 다시 렌더
  const res = document.getElementById("photo-result");
  if(res){
    res.innerHTML = `
      <div class="ai-box" style="margin-top:14px;border:1px solid rgba(52,211,153,.3);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <span style="font-size:20px;">✅</span>
          <span style="font-size:14px;font-weight:700;color:var(--g);">분석 완료 — ${lastAnalyzed.length}개 항목 추출</span>
        </div>
        ${lastAnalyzed.map((it,i)=>renderAnalyzedItem(it,i,photoTarget)).join("")}
        <button class="btn btn-p btn-w" style="margin-top:12px;" onclick="saveAllAnalyzed()">💾 모두 저장 (${lastAnalyzed.length}개)</button>
      </div>`;
  }
};

window.saveAllAnalyzed = function(){
  if(!lastAnalyzed || !lastAnalyzed.length){ alert("저장할 항목이 없습니다"); return; }

  let count = 0;
  if(photoTarget==="stock"){
    let warnings = [];
    let skipped = [];
    let abnormal = [];

    lastAnalyzed.forEach(it=>{
      if(!it.name) return;

      // 비종목 자동 제외
      if(/^(현금|예수금|국내\s?현금|USD\s?현금|cash|usd)$/i.test(it.name.trim())){
        skipped.push(it.name);
        return;
      }

      let qty = Number(it.qty)||0;
      let avg = Number(it.avg)||0;
      let cur = Number(it.cur)||avg||0;

      // 자동 보정 시도
      if(qty > 500000){
        // qty가 평가금액일 가능성 — cur로 나눠서 추정
        if(cur > 100 && cur < 1000000){
          const newQty = Math.round(qty / cur);
          if(newQty > 0 && newQty < 100000){
            warnings.push(`${it.name}: 수량 ${qty.toLocaleString()}→${newQty}`);
            qty = newQty;
          } else {
            abnormal.push(`${it.name} (수량 ${N(qty)})`);
          }
        } else {
          abnormal.push(`${it.name} (수량 ${N(qty)})`);
        }
      }

      // avg와 cur이 같은 큰 숫자면 평가금액 잘못 넣은 것
      if(avg === cur && avg > 100000 && qty > 1 && qty < 100){
        const real = Math.round(avg / qty);
        if(real > 100 && real < 1000000){
          warnings.push(`${it.name}: 평균/현재 ${avg.toLocaleString()}→${real.toLocaleString()}`);
          avg = real;
          cur = real;
        } else {
          abnormal.push(`${it.name} (avg=cur=${N(avg)})`);
        }
      }

      // 최종 검증
      const total = qty * cur;
      if(total > 1e10){
        abnormal.push(`${it.name}: 평가가치 ${B(total)}원 비정상`);
      }

      S.stocks.push({
        id:Date.now()+count,
        ticker:it.ticker||"",
        name:it.name,
        qty, avg, cur,
        signal:"hold"
      });
      count++;
    });

    let msg = "";
    if(skipped.length) msg += "ℹ️ 제외됨 (비종목): " + skipped.join(", ") + "\n\n";
    if(warnings.length) msg += "🔧 자동 보정:\n" + warnings.join("\n") + "\n\n";
    if(abnormal.length) msg += "⚠️ 보정 실패 — 주식 탭에서 직접 수정하세요:\n" + abnormal.join("\n");
    if(msg) setTimeout(()=>alert(msg), 800);
  } else {
    let pSkipped = [];
    let pWarnings = [];
    let pNeedReview = false;

    lastAnalyzed.forEach(it=>{
      if(!it.name) return;

      if(/^(현금자산|예수금|현금|cash|디폴트옵션)/i.test(it.name.trim())){
        pSkipped.push(it.name);
        return;
      }

      const amount = Number(it.amount)||0;
      if(amount === 0){
        pSkipped.push(it.name + "(0원)");
        return;
      }

      // 100억 이상은 비정상
      if(amount > 1e10){
        pWarnings.push(`${it.name}: ${B(amount)}원`);
      }

      S.pension.funds.push({
        id:Date.now()+count,
        name:it.name,
        type:it.type||"기타",
        amount,
        ytd:Number(it.ytd)||0,
        signal:"hold"
      });
      count++;
    });
    S.pension.total = S.pension.funds.reduce((a,f)=>a+(Number(f.amount)||0), 0);
    S.pension.at = ts();

    let pMsg = "";
    if(pSkipped.length) pMsg += "ℹ️ 제외됨: " + pSkipped.join(", ") + "\n\n";
    if(pWarnings.length) pMsg += "⚠️ 비정상 항목 — 연금 탭에서 ✏️ 수정하세요:\n" + pWarnings.join("\n") + "\n\n";
    pMsg += "💡 저장 후 연금 탭에서 종목명·금액·수익률 부호를 한번 더 확인해주세요.\nAI는 글자가 흐릿하거나 +/- 부호를 잘못 읽을 수 있습니다.";
    setTimeout(()=>alert(pMsg), 800);
  }

  S.at = ts(); save();

  const res = document.getElementById("photo-result");
  if(res) res.innerHTML = `
    <div class="ai-box" style="margin-top:14px;border-left:3px solid var(--g);text-align:center;padding:20px;">
      <div style="font-size:32px;margin-bottom:8px;">✅</div>
      <div style="font-size:14px;font-weight:700;color:var(--g);margin-bottom:4px;">${count}개 항목 저장 완료!</div>
      <div style="font-size:11px;color:var(--tx3);margin-bottom:14px;">localStorage에 저장됐습니다</div>
      <button class="btn btn-p btn-w" onclick="goPage('${photoTarget==='stock'?'stocks':'pension'}')">📋 저장된 자산 확인 →</button>
    </div>`;
  photoFiles=[]; lastAnalyzed=null;
  const st=document.getElementById("upload-status"); if(st) st.innerHTML="";
  const pp=document.getElementById("photo-preview"); if(pp) pp.innerHTML="";
  const pa=document.getElementById("photo-actions"); if(pa) pa.innerHTML="";
};

window.manualFromPhoto = function(){
  if(photoTarget==="stock"){
    openDrawer(`

window.cleanBadData = function(){
  let report = [];
  // 주식: qty가 비정상적으로 큰 항목 검출
  const before = S.stocks.length;
  S.stocks = S.stocks.filter(s=>{
    const q = Number(s.qty)||0;
    const c = Number(s.cur)||0;
    const total = q*c;
    // 평가금액이 1000억 이상이면 비정상
    if(total > 1e11){
      report.push(`삭제: ${s.name} (수량 ${q.toLocaleString()}, 평가 ${B(total)}원)`);
      return false;
    }
    return true;
  });
  // 연금: amount > 100억 비정상
  const pBefore = S.pension.funds.length;
  S.pension.funds = S.pension.funds.filter(f=>{
    if((Number(f.amount)||0) > 1e10){
      report.push(`삭제: ${f.name} (${B(f.amount)}원)`);
      return false;
    }
    return true;
  });
  S.pension.total = S.pension.funds.reduce((a,f)=>a+(Number(f.amount)||0), 0);
  S.at = ts(); save();
  if(report.length){
    alert("정리 완료:\n\n" + report.join("\n"));
  } else {
    alert("✅ 비정상 데이터 없음");
  }
  renderPage();
};

/* ══════════════════════════════════════════════════════
   서비스 워커 (PWA 오프라인)
══════════════════════════════════════════════════════ */
if("serviceWorker" in navigator){
  const swCode=`
    self.addEventListener("install",e=>self.skipWaiting());
    self.addEventListener("activate",e=>clients.claim());
    self.addEventListener("fetch",e=>{
      if(e.request.url.includes("anthropic.com")) return;
      e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
        return caches.open("wo-v1").then(c=>{c.put(e.request,res.clone());return res;});
      })));
    });`;
  const blob=new Blob([swCode],{type:"application/javascript"});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

function _pwGet(){ try{return localStorage.getItem("wo_pw")||"01234";}catch(e){return "01234";} }
function _pwSet(v){ try{localStorage.setItem("wo_pw",v);}catch(e){} }

function _lockShow(){
  var ov = document.createElement("div");
  ov.id = "_LK";
  ov.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#070d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:sans-serif;";
  ov.innerHTML =
    '<div style="font-size:48px;margin-bottom:8px">📊</div>' +
    '<div style="font-size:20px;font-weight:900;color:#7eb8ff;margin-bottom:4px">WealthOS</div>' +
    '<div style="font-size:11px;color:#3a5070;margin-bottom:32px">통합 자산관리</div>' +
    '<div style="width:100%;max-width:280px">' +
      '<input id="_PI" type="password" inputmode="numeric" placeholder="비밀번호" maxlength="20" style="width:100%;padding:14px;font-size:16px;background:#0d1828;color:#ddeeff;border:2px solid #4f80ff;border-radius:10px;text-align:center;outline:none;box-sizing:border-box;margin-bottom:10px"/>' +
      '<button id="_PB" style="width:100%;padding:14px;background:#4f80ff;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">잠금 해제</button>' +
      '<div id="_PE" style="color:#f87171;text-align:center;font-size:12px;margin-top:8px;min-height:16px"></div>' +
      '<div style="color:#3a5070;text-align:center;font-size:11px;margin-top:14px">초기 비밀번호: <b style="color:#7a99cc">01234</b></div>' +
    '</div>';
  document.body.appendChild(ov);

  var inp = document.getElementById("_PI");
  var btn = document.getElementById("_PB");
  var err = document.getElementById("_PE");
  var fail = 0;

  function check(){
    var v = (inp.value||"").trim();
    if(v === _pwGet()){
      ov.parentNode.removeChild(ov);
    } else {
      fail++;
      inp.value = "";
      inp.focus();
      err.textContent = fail >= 3 ? "잠시 후 재시도" : "비밀번호 오류 (" + fail + "/3)";
      if(fail >= 3){
        btn.disabled = true; btn.style.opacity = "0.4";
        setTimeout(function(){
          btn.disabled = false; btn.style.opacity = "1";
          fail = 0; err.textContent = "";
        }, 5000);
      }
    }
  }

  btn.addEventListener("click", check);
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter") check(); });
  setTimeout(function(){ inp.focus(); }, 200);
}

window.saveApiKey = function(){
  const v = document.getElementById("api-key").value.trim();
  const m = document.getElementById("api-key-msg");
  if(!v){ m.style.color="#f87171"; m.textContent="API 키를 입력하세요"; return; }
  if(!v.startsWith("sk-ant-")){ m.style.color="#f87171"; m.textContent="잘못된 형식 (sk-ant-... 로 시작해야 함)"; return; }
  try{ localStorage.setItem("wo_apikey", v); }catch(e){}
  m.style.color="#34d399"; m.textContent="✅ API 키 저장 완료!";
  setTimeout(()=>{ m.textContent=""; }, 2000);
};

window.resetApiUsage = function(){
  if(!confirm("API 사용량 통계를 모두 초기화할까요?\n(실제 청구는 Anthropic 콘솔에서 확인)")) return;
  S.apiUsage = JSON.parse(JSON.stringify(DEFAULT.apiUsage));
  save();
  renderPage();
};

window.saveAlphaKey = function(){
  const v = (document.getElementById("alpha-key").value || "").trim();
  const msg = document.getElementById("alpha-key-msg");
  if(!v){
    if(msg){ msg.textContent = "키가 비어있습니다"; msg.style.color = "var(--r)"; }
    return;
  }
  try{ localStorage.setItem("wo_alphavantage_key", v); }catch(e){}
  if(msg){ msg.textContent = "✅ Alpha Vantage 키 저장됨"; msg.style.color = "var(--g)"; }
};

window.changePw = function(){
  var c = document.getElementById("pw-cur");
  var n = document.getElementById("pw-new");
  var n2 = document.getElementById("pw-new2");
  var m = document.getElementById("pw-msg");
  if(!c||!n||!n2||!m) return;
  if(c.value !== _pwGet()){ m.style.color="#f87171"; m.textContent="현재 비밀번호 오류"; return; }
  if(n.value.length < 4){ m.style.color="#f87171"; m.textContent="4자리 이상"; return; }
  if(n.value !== n2.value){ m.style.color="#f87171"; m.textContent="불일치"; return; }
  _pwSet(n.value);
  m.style.color="#34d399"; m.textContent="✅ 변경 완료";
  setTimeout(function(){ c.value=""; n.value=""; n2.value=""; m.textContent=""; }, 2000);
};

updateClock();
renderTabbar();
renderPage();
setTimeout(bindPhotoEvents, 100);
_lockShow();

// 초기 로드 시 VIX/VKOSPI 자동 업데이트 시도
setTimeout(() => {
  if(typeof refreshIndices === 'function'){
    refreshIndices().then(updated => {
      if(updated && (currentPage === 'home' || currentPage === 'vix')){
        renderPage();
      }
    });
  }
}, 1000);

</script>
