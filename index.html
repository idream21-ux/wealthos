<!DOCTYPE html>
<html lang="ko">
<head>

  <!-- PWA 매니페스트 인라인 (별도 파일 없이) -->
  <script>
    // 매니페스트를 동적으로 생성해 링크 태그 주입
    const manifest = {
      name: "WealthOS 통합 자산관리",
      short_name: "WealthOS",
      description: "주식·연금·부동산·차량·VIX 공포지수 통합 자산관리",
      start_url: "./",
      display: "standalone",
      background_color: "#070d1a",
      theme_color: "#070d1a",
      orientation: "portrait",
      icons: [
        { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23070d1a'/><text y='68' x='50' text-anchor='middle' font-size='60'>📊</text></svg>", sizes: "192x192", type: "image/svg+xml" },
        { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23070d1a'/><text y='68' x='50' text-anchor='middle' font-size='60'>📊</text></svg>", sizes: "512x512", type: "image/svg+xml" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const url  = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel   = 'manifest'; link.href = url;
    document.head.appendChild(link);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500;600&display=swap"/>

  <style>
/* ═══════════════════════ RESET & VARS ═══════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070d1a;--s1:#0d1828;--s2:#111e33;--s3:#16253e;
  --b1:rgba(80,140,255,.10);--b2:rgba(80,140,255,.22);
  --acc:#4f80ff;--acc2:#7eb8ff;
  --g:#34d399;--r:#f87171;--y:#fbbf24;--p:#a78bfa;
  --tx:#ddeeff;--tx2:#a0b8dc;--tx3:#7088aa;
  --nav:64px;--top:52px;
  --rad:12px;--rad-s:8px;
  --mono:'DM Mono',monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html,body{
  background:var(--bg);color:var(--tx);
  font-family:'Noto Sans KR',sans-serif;
  font-size:14px;line-height:1.5;
  height:100%;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

/* ═══════════════════════ LAYOUT ═══════════════════════ */
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;}

/* Topbar */
#topbar{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:100;
  height:calc(var(--top) + var(--safe-t));
  padding-top:var(--safe-t);
  background:rgba(7,13,26,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--b1);
  display:flex;align-items:center;padding-left:16px;padding-right:16px;gap:10px;
}
.logo{font-size:17px;font-weight:900;color:var(--acc2);letter-spacing:-.4px;flex:1;}
.topbar-time{font-family:var(--mono);font-size:10px;color:var(--tx3);}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--g);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.icon-btn{background:none;border:none;cursor:pointer;font-size:19px;padding:4px 6px;color:var(--tx3);line-height:1;}

/* Scroll area */
#scroll{
  position:fixed;
  top:calc(var(--top) + var(--safe-t));
  bottom:calc(var(--nav) + var(--safe-b));
  left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 12px 8px;
}

/* Tabbar */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:100;
  background:rgba(7,13,26,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--b1);
  display:flex;align-items:flex-start;
  padding-top:8px;
  padding-bottom:calc(8px + var(--safe-b));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:0 2px;}
.tab-ico{font-size:19px;transition:transform .15s;}
.tab-lbl{font-size:9.5px;font-weight:700;color:var(--tx3);transition:color .15s;white-space:nowrap;}
.tab.on .tab-ico{transform:scale(1.15);}
.tab.on .tab-lbl{color:var(--acc2);}
.tab-bdg{
  position:absolute;top:-3px;right:-6px;
  background:var(--r);color:#fff;font-size:8px;font-weight:900;
  border-radius:8px;padding:1px 5px;min-width:14px;text-align:center;
}

/* ═══════════════════════ CARDS ═══════════════════════ */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rad);padding:16px;margin-bottom:12px;}
.card-sm{padding:12px 14px;}
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:12px;}

/* Horizontal scroll */
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -12px;padding-left:12px;padding-right:12px;}
.hrow::-webkit-scrollbar{display:none;}
.hcard{
  min-width:128px;flex-shrink:0;
  background:var(--s1);border:1px solid var(--b1);
  border-radius:var(--rad);padding:13px;position:relative;overflow:hidden;
}
.hcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--hc,var(--acc));}
.hc-lbl{font-size:9.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.hc-val{font-size:16px;font-weight:900;font-family:var(--mono);}
.hc-sub{font-size:10px;color:var(--tx3);margin-top:3px;}

/* Stamp */
.stamp{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;color:var(--tx3);background:var(--s2);padding:2px 7px;border-radius:4px;border:1px solid var(--b1);}

/* ═══════════════════════ TABLE ═══════════════════════ */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;padding:5px 7px;border-bottom:1px solid var(--b1);text-align:left;}
.tbl td{padding:8px 7px;border-bottom:1px solid rgba(80,140,255,.05);font-size:12px;vertical-align:middle;}
.tbl tr:last-child td{border:none;}

/* ═══════════════════════ TAGS ═══════════════════════ */
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.buy{background:rgba(52,211,153,.14);color:#34d399;border:1px solid rgba(52,211,153,.2);}
.sell{background:rgba(248,113,113,.14);color:#f87171;border:1px solid rgba(248,113,113,.2);}
.hold{background:rgba(251,191,36,.14);color:#fbbf24;border:1px solid rgba(251,191,36,.2);}
.watch{background:rgba(167,139,250,.14);color:#a78bfa;border:1px solid rgba(167,139,250,.2);}
.up{color:#34d399;}.dn{color:#f87171;}.dim{color:var(--tx3);}

/* ═══════════════════════ BUTTONS ═══════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:11px 16px;border-radius:var(--rad-s);font-size:13px;font-weight:700;
  cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;
  transition:opacity .12s,transform .12s;user-select:none;}
.btn:active{opacity:.7;transform:scale(.97);}
.btn-p{background:var(--acc);color:#fff;}
.btn-g{background:transparent;border:1px solid var(--b2);color:var(--tx2);}
.btn-gr{background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.2);color:#34d399;}
.btn-rd{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.2);color:#f87171;}
.btn-w{width:100%;}
.btn-sm{padding:7px 12px;font-size:11.5px;}
.btn-xs{padding:4px 9px;font-size:10.5px;}

/* ═══════════════════════ FORM ═══════════════════════ */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:5px;}
.fi,.fs{
  width:100%;background:var(--s2);border:1px solid var(--b2);
  border-radius:var(--rad-s);padding:12px 13px;color:var(--tx);
  font-size:14px;font-family:'Noto Sans KR',sans-serif;
  outline:none;-webkit-appearance:none;appearance:none;
}
.fi:focus,.fs:focus{border-color:var(--acc);}
.fs option{background:var(--s2);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ═══════════════════════ DRAWER ═══════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;backdrop-filter:blur(4px);animation:fadein .18s;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.drawer{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--s1);border-radius:18px 18px 0 0;
  z-index:201;padding:0 16px;
  max-height:88vh;overflow-y:auto;
  animation:slideup .25s cubic-bezier(.34,1.2,.64,1);
  padding-bottom:calc(20px + var(--safe-b));
}
@keyframes slideup{from{transform:translate(-50%,100%);}to{transform:translate(-50%,0);}}
.dhandle{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:12px auto 16px;}
.dtitle{font-size:16px;font-weight:900;margin-bottom:16px;}

/* ═══════════════════════ VIX ═══════════════════════ */
.vix-num{font-size:60px;font-weight:900;font-family:var(--mono);text-align:center;line-height:1;}
.vix-badge{font-size:13px;font-weight:700;padding:3px 14px;border-radius:20px;display:inline-block;margin-top:5px;}
.vix-bar{height:13px;border-radius:7px;background:linear-gradient(90deg,#00ffaa,#34d399 20%,#fbbf24 45%,#fb923c 70%,#ff4444);position:relative;margin:14px 0 5px;}
.vix-needle{position:absolute;top:-4px;width:4px;height:21px;border-radius:2px;background:#fff;transform:translateX(-50%);box-shadow:0 0 8px rgba(255,255,255,.7);transition:left .9s cubic-bezier(.34,1.4,.64,1);}
.vix-lbl{display:flex;justify-content:space-between;font-size:9px;color:var(--tx3);}
.vix-hist{display:flex;align-items:flex-end;gap:3px;height:38px;margin-top:10px;}
.vh-bar{flex:1;border-radius:2px 2px 0 0;}

/* ═══════════════════════ REBAL BAR ═══════════════════════ */
.rb-wrap{margin-bottom:12px;}
.rb-head{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;}
.rb-track{height:6px;background:var(--s3);border-radius:3px;position:relative;overflow:visible;}
.rb-fill{height:100%;border-radius:3px;transition:width .5s;}
.rb-tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.5);border-radius:1px;}

/* ═══════════════════════ MISC ═══════════════════════ */
.prog{height:5px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:8px;}
.prog-f{height:100%;border-radius:3px;transition:width .5s;}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-title{font-size:15px;font-weight:900;}
.empty{text-align:center;padding:40px 16px;color:var(--tx3);}
.empty-ico{font-size:40px;margin-bottom:10px;}
.tabs-row{display:flex;gap:3px;background:var(--s2);border-radius:8px;padding:3px;margin-bottom:14px;}
.tab-pill{flex:1;text-align:center;padding:8px 4px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx2);transition:all .14s;}
.tab-pill.on{background:var(--s3);color:var(--tx);font-weight:700;}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--s3);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--acc);}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;}
.toggle.on::after{left:21px;}
.alert-item{display:flex;gap:10px;padding:10px 12px;border-radius:var(--rad-s);background:var(--s2);border-left:3px solid var(--b2);margin-bottom:8px;}
.spinner{width:16px;height:16px;border:2px solid rgba(79,128,255,.3);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.photo-drop{border:2px dashed var(--b2);border-radius:var(--rad);padding:26px 16px;text-align:center;cursor:pointer;transition:all .18s;}
.photo-drop.drag{border-color:var(--acc);background:rgba(79,128,255,.05);}
.photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--s2);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:none;color:#fff;border-radius:4px;padding:2px 6px;font-size:11px;cursor:pointer;}
.ai-box{background:var(--s2);border-radius:var(--rad-s);padding:12px 14px;margin-top:10px;font-size:12px;color:var(--tx2);line-height:1.6;}

@media(min-width:480px){
  #app,#topbar,#tabbar,#scroll,.drawer{border-left:1px solid var(--b1);border-right:1px solid var(--b1);}
  #scroll{max-width:480px;}
}
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">📊 WealthOS</div>
    <div class="pulse"></div>
    <div class="topbar-time" id="clock">--:--</div>
    <button class="icon-btn" onclick="goPage('settings')">⚙</button>
  </div>
  <div id="scroll"></div>
  <div id="tabbar"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   WealthOS PWA — 단일 HTML 파일 앱
   수정 방법: 이 파일을 편집기로 열어서 JS 부분 수정
   → 저장 → 브라우저 새로고침 (F5) → 즉시 반영
═══════════════════════════════════════════════════════ */

/* ── 1. 스토리지 ────────────────────────────────────── */
const DB = {
  get(k){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch{} },
  del(k){ try{localStorage.removeItem(k);}catch{} }
};

/* ── 2. 기본 데이터 ──────────────────────────────────── */
const DEFAULT = {
  vix:{value:28.4,prev:24.1,hist:[18,20,22,19,24,28,31,28,26,28],at:new Date().toISOString()},
  vkospi:{value:22.1,prev:20.5,hist:[15,17,19,16,21,24,26,22,21,22],at:new Date().toISOString()},
  sox:{value:1.5,prev:0.8,hist:[-2.1,-0.8,1.2,0.5,2.1,1.5,-0.3,1.8,2.3,1.5],at:new Date().toISOString()},
  kospi:{value:7643,prev:7822,high52w:7999,hist:[6800,7000,7200,7400,7500,7600,7700,7800,7822,7643],at:new Date().toISOString()},
  apiUsage:{
    monthly:{},  // {"2026-05": {sonnet:{calls:0,inTokens:0,outTokens:0}, opus:{...}}}
    daily:{},    // {"2026-05-22": {sonnet:0, opus:0}}
    lastReset:new Date().toISOString()
  },
  loans:[],
  pension:{
    total:342000000,
    target:{ds:40,fs:30,bd:20,al:10},
    current:{ds:47,fs:28,bd:18,al:7},
    funds:[
      {id:1,name:"삼성 TDF 2040",type:"국내주식",amount:96500000,ytd:8.4,signal:"hold"},
      {id:2,name:"미래에셋 글로벌",type:"해외주식",amount:74200000,ytd:12.1,signal:"buy"},
      {id:3,name:"한국채권인덱스",type:"채권",amount:52800000,ytd:2.3,signal:"hold"},
      {id:4,name:"KB리츠혼합",type:"대안",amount:18500000,ytd:-1.2,signal:"watch"},
    ],at:new Date().toISOString()
  },
  stocks:[
    {id:1,ticker:"005930",name:"삼성전자",qty:400,avg:68500,cur:74200,signal:"buy"},
    {id:2,ticker:"000660",name:"SK하이닉스",qty:150,avg:142000,cur:188500,signal:"hold"},
    {id:3,ticker:"035420",name:"NAVER",qty:80,avg:195000,cur:178000,signal:"buy"},
    {id:4,ticker:"051910",name:"LG화학",qty:60,avg:340000,cur:298000,signal:"sell"},
  ],
  realestate:[
    {id:1,name:"강남구 아파트",type:"아파트",buy:1200000000,cur:1380000000,signal:"hold",ryd:2.8},
    {id:2,name:"판교 오피스텔",type:"오피스텔",buy:280000000,cur:265000000,signal:"watch",ryd:4.2},
  ],
  vehicles:[
    {id:1,name:"BMW 5시리즈",year:2022,buy:72000000,cur:58000000,km:38000,signal:"hold"},
    {id:2,name:"테슬라 모델Y",year:2023,buy:62000000,cur:52000000,km:22000,signal:"hold"},
  ],
  cash:150000000,
  at:new Date().toISOString()
};

/* ── 3. 상태 ─────────────────────────────────────────── */
let S = DB.get("wo_data") || JSON.parse(JSON.stringify(DEFAULT));
if(!S.vkospi){
  S.vkospi = JSON.parse(JSON.stringify(DEFAULT.vkospi));
  save();
}
if(!S.loans){
  S.loans = [];
  save();
}
if(!S.sox){
  S.sox = JSON.parse(JSON.stringify(DEFAULT.sox));
  save();
}
if(!S.kospi){
  S.kospi = JSON.parse(JSON.stringify(DEFAULT.kospi));
  save();
}
if(!S.apiUsage){
  S.apiUsage = JSON.parse(JSON.stringify(DEFAULT.apiUsage));
  save();
}
// KOSPI 데이터 정합성 자동 보정
if(S.kospi){
  let needsSave = false;
  // 값이 비정상적으로 낮으면 (옛날 박스피 시절 값) → 최신 기본값으로 복원
  if(S.kospi.value < 5000){
    console.warn("KOSPI 값 이상 감지, 보정:", S.kospi.value);
    S.kospi.value = DEFAULT.kospi.value;
    S.kospi.prev = DEFAULT.kospi.prev;
    needsSave = true;
  }
  // 52주 최고가가 현재값보다 낮으면 보정
  if(!S.kospi.high52w || S.kospi.high52w < S.kospi.value){
    S.kospi.high52w = Math.max(S.kospi.value, DEFAULT.kospi.high52w);
    needsSave = true;
  }
  // hist에 비정상 값 포함 시 보정
  if(S.kospi.hist && S.kospi.hist.some(v => v < 5000)){
    S.kospi.hist = DEFAULT.kospi.hist;
    needsSave = true;
  }
  if(needsSave) save();
}
let currentPage = "home";

function save(){ DB.set("wo_data",S); }
function ts(){ return new Date().toISOString(); }
function now(){ return new Date(); }

/* ── 4. 유틸 ─────────────────────────────────────────── */
const N  = n => new Intl.NumberFormat("ko-KR").format(n);
const B  = n => n>=1e8?(n/1e8).toFixed(1)+"억":n>=1e4?(n/1e4).toFixed(0)+"만":N(n);
const DT = d => { const x=new Date(d); return x.toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit"})+" "+x.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}); };
const DF = d => new Date(d).toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"});
const PL = (a,c) => (((c-a)/a)*100).toFixed(1);
const esc= s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* 페이지 열 때마다 호출 - VIX/VKOSPI 갱신 시도 (하루 1회) */
async function refreshIndices(){
  const apiKey = (localStorage.getItem("wo_apikey")||"").trim();
  const alphaKey = (localStorage.getItem("wo_alphavantage_key")||"").trim();

  // 갱신 필요 여부 판단
  const lastDate = S.vix?.at ? new Date(S.vix.at).toDateString() : "";
  const now = new Date();
  const todayDate = now.toDateString();
  const dayOfWeek = now.getDay();
  const hourOfDay = now.getHours();

  if(lastDate === todayDate){
    const isMondayMorningFromWeekend = (dayOfWeek === 1 && hourOfDay < 15);
    const isAfterMarketClose = (hourOfDay >= 16);
    if(!isMondayMorningFromWeekend && !isAfterMarketClose){
      return false;
    }
  }

  let anySuccess = false;

  // ─────────────────────────────────────────────────────────
  // 전략 1: Yahoo Finance v8 Chart + CORS 프록시
  // ─────────────────────────────────────────────────────────
  const yahooData = await tryYahooFinance();
  if(yahooData && yahooData.success){
    applyMarketData(yahooData);
    anySuccess = true;
  }

  // ─────────────────────────────────────────────────────────
  // 전략 2: Alpha Vantage (사용자 키 있으면, VIX 보조)
  // ─────────────────────────────────────────────────────────
  if(alphaKey && !S.vix?.source?.includes("Yahoo")){
    const alphaData = await tryAlphaVantage(alphaKey);
    if(alphaData && alphaData.success){
      applyMarketData(alphaData);
      anySuccess = true;
    }
  }

  // ─────────────────────────────────────────────────────────
  // 전략 3: Claude API (VKOSPI 항상, 다른 것도 폴백)
  // ─────────────────────────────────────────────────────────
  if(apiKey){
    const claudeData = await tryClaudeAPI(apiKey);
    if(claudeData && claudeData.success){
      // Yahoo가 이미 채운 데이터는 덮어쓰지 않고, 비어있는 것만 채움
      const merged = {success: true, source: claudeData.source};
      // VKOSPI는 항상 Claude에서 (Yahoo에 없음)
      if(claudeData.vkospi) merged.vkospi = claudeData.vkospi;
      // 나머지는 Yahoo에 이미 적용됐으면 스킵 (소스 비교)
      if(!S.vix?.source?.includes("Yahoo") && claudeData.vix) merged.vix = claudeData.vix;
      if(!S.sox?.source?.includes("Yahoo") && claudeData.sox !== undefined) merged.sox = claudeData.sox;
      if(!S.kospi?.source?.includes("Yahoo") && claudeData.kospi){
        merged.kospi = claudeData.kospi;
        if(claudeData.kospi52w) merged.kospi52w = claudeData.kospi52w;
      }
      if(merged.vix || merged.vkospi || merged.sox !== undefined || merged.kospi){
        applyMarketData(merged);
        anySuccess = true;
      }
    }
  }

  if(anySuccess) return true;

  // 모두 실패 — 시각만 갱신
  S.vix.at = ts();
  if(S.vkospi) S.vkospi.at = ts();
  if(S.sox) S.sox.at = ts();
  if(S.kospi) S.kospi.at = ts();
  save();
  return false;
}

// Yahoo Finance를 CORS 프록시로 호출
window.forceRefreshIndices = async function(){

    <div class="dtitle">🔍 데이터 소스 진단</div>

    {name: "corsproxy.io", build: u => "https://corsproxy.io/?" + encodeURIComponent(u)},
  ];

  let yahooSuccess = false;
  const symbols = [
    {key:"VIX", code:"%5EVIX"},
    {key:"SOX", code:"%5ESOX"},
    {key:"KOSPI", code:"%5EKS11"}
  ];

  for(const proxy of proxies){
    log(`  ▸ ${proxy.name} 시도 (v8 차트 API)...`, "var(--tx3)");

    const proxyResult = { success: true, source: "Yahoo (" + proxy.name + ")" };

    for(const sym of symbols){
      const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym.code}?range=5d&interval=1d`;
      try {
        const resp = await fetch(proxy.build(yahooUrl), {method:"GET"});
        if(!resp.ok){
          log(`    ${sym.key}: HTTP ${resp.status}`, "var(--r)");
          continue;
        }
        const text = await resp.text();
        const json = JSON.parse(text);
        const data = json.chart?.result?.[0];
        if(!data){
          if(json.chart?.error){
            log(`    ${sym.key}: ${json.chart.error.description || 'API 차단'}`, "var(--r)");
          } else {
            log(`    ${sym.key}: 데이터 없음`, "var(--r)");
          }
          continue;
        }

        const meta = data.meta;
        const closes = data.indicators?.quote?.[0]?.close || [];
        const validCloses = closes.filter(v => v !== null);
        // meta 값 우선 사용 (가장 정확)
        let lastClose = meta?.regularMarketPrice;
        let prevClose = meta?.chartPreviousClose;
        // meta 값 없으면 차트 배열 사용
        if(typeof lastClose !== "number" && validCloses.length >= 1){
          lastClose = validCloses[validCloses.length - 1];
        }
        if(typeof prevClose !== "number" && validCloses.length >= 2){
          prevClose = validCloses[validCloses.length - 2];
        }

        log(`    ✅ ${sym.key}: ${lastClose?.toFixed(2)} (전일 ${prevClose?.toFixed(2)})`, "var(--g)");
        proxyWorks = true;

        if(sym.key === "VIX") {
          proxyResult.vix = lastClose;
          proxyResult.vixPrev = prevClose;
        }
        if(sym.key === "SOX") {
          if(typeof lastClose === "number" && typeof prevClose === "number" && prevClose > 0){
            const soxPct = ((lastClose - prevClose) / prevClose) * 100;
            proxyResult.sox = soxPct;
            log(`      SOX 변동률: ${soxPct.toFixed(2)}% (${lastClose.toFixed(2)} ÷ ${prevClose.toFixed(2)})`, "var(--tx2)");

        if(sym.key === "KOSPI") {
          proxyResult.kospi = lastClose;
          proxyResult.kospiPrev = prevClose;
          if(typeof meta?.fiftyTwoWeekHigh === "number") proxyResult.kospi52w = meta.fiftyTwoWeekHigh;
        }
      } catch(e) {
        log(`    ${sym.key}: ${e.message}`, "var(--r)");
      }
    }

    if(proxyWorks){
      applyMarketData(proxyResult);
      log(`  ✅ ${proxy.name} 성공 — 데이터 적용 완료`, "var(--g)");
      yahooSuccess = true;
      break;
    } else {
      log(`  ❌ ${proxy.name} 모두 실패`, "var(--r)");
    }
  }

  // Claude AI 시도 (Yahoo 성공해도 VKOSPI는 Claude에서)
  log("\n📡 2단계: Claude AI 시도 (VKOSPI 필수)", "var(--acc2)");
  const claudeKey = (localStorage.getItem("wo_apikey")||"").trim();
  if(!claudeKey){
    log("  ⚠️ Claude API 키 미등록", "var(--y)");
  } else {
    try {
      const claudeResult = await tryClaudeAPI(claudeKey);
      if(claudeResult && claudeResult.success){
        const merged = {success:true, source:"Claude AI"};
        if(claudeResult.vkospi) merged.vkospi = claudeResult.vkospi;
        // Yahoo가 못 가져온 것만 Claude로 채움
        if(!S.vix?.source?.includes("Yahoo") && claudeResult.vix) merged.vix = claudeResult.vix;
        if(!S.sox?.source?.includes("Yahoo") && claudeResult.sox !== undefined) merged.sox = claudeResult.sox;
        if(!S.kospi?.source?.includes("Yahoo") && claudeResult.kospi){
          merged.kospi = claudeResult.kospi;
          if(claudeResult.kospi52w) merged.kospi52w = claudeResult.kospi52w;
        }
        applyMarketData(merged);
        log(`  ✅ Claude AI 적용: ${Object.keys(merged).filter(k=>k!=='success'&&k!=='source').join(', ')}`, "var(--g)");
      } else {

      }
    } catch(e) {
      log(`  ❌ Claude API 예외: ${e.message}`, "var(--r)");
    }
  }

  if(!yahooSuccess){
    log("\n📡 3단계: Alpha Vantage 시도", "var(--acc2)");
    const alphaKey = (localStorage.getItem("wo_alphavantage_key")||"").trim();

    if(!alphaKey){
      log("  ⚠️ Alpha Vantage 키 미등록 — 설정 페이지에서 등록 가능", "var(--y)");
    } else {
      try {

async function tryYahooFinance(){
  // ⚠️ Yahoo v7 quote API는 2025년 무료 사용자에 차단됨
  // 대안: v8 chart API (아직 무료, 5일치 종가 데이터 포함)
  const symbols = [
    {key:"vix", code:"%5EVIX"},
    {key:"sox", code:"%5ESOX"},
    {key:"kospi", code:"%5EKS11"}
  ];

  const proxies = [
    {name:"allorigins.win", build: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u)},
    {name:"corsproxy.io", build: u => "https://corsproxy.io/?" + encodeURIComponent(u)},
  ];

  // 첫 번째로 성공하는 프록시 찾기
  let workingProxy = null;
  for(const proxy of proxies){
    try{
      const testUrl = proxy.build(`https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?range=5d&interval=1d`);
      const resp = await fetch(testUrl, {method:"GET", headers:{"Accept":"application/json"}});
      if(!resp.ok) continue;
      const text = await resp.text();
      if(text.length < 100) continue;  // 너무 짧으면 실패
      const json = JSON.parse(text);
      if(json.chart && json.chart.result && json.chart.result[0]){
        workingProxy = proxy;
        break;
      }
    } catch(e) { continue; }
  }

  if(!workingProxy) return null;

  const result = { success: true, source: "Yahoo Chart (" + workingProxy.name + ")" };

  for(const sym of symbols){
    try{
      const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym.code}?range=5d&interval=1d`;
      const resp = await fetch(workingProxy.build(yahooUrl));
      if(!resp.ok) continue;

      const json = await resp.json();
      const data = json.chart?.result?.[0];
      if(!data) continue;

      const meta = data.meta;
      const closes = data.indicators?.quote?.[0]?.close || [];
      const validCloses = closes.filter(v => v !== null && v !== undefined);

      // 가장 정확한 현재가: meta.regularMarketPrice (실시간 또는 마지막 거래)
      // 가장 정확한 전일 종가: meta.chartPreviousClose (정확한 직전 거래일 종가)
      let lastClose = meta?.regularMarketPrice;
      let prevClose = meta?.chartPreviousClose;

      // meta 값이 없을 때만 차트 배열 사용
      if(typeof lastClose !== "number" && validCloses.length >= 1){
        lastClose = validCloses[validCloses.length - 1];
      }
      if(typeof prevClose !== "number" && validCloses.length >= 2){
        prevClose = validCloses[validCloses.length - 2];
      }

      const high52w = meta?.fiftyTwoWeekHigh;

      if(sym.key === "vix" && typeof lastClose === "number"){
        result.vix = lastClose;
        result.vixPrev = prevClose;
      }
      if(sym.key === "sox" && typeof lastClose === "number" && typeof prevClose === "number" && prevClose > 0){
        // meta의 정확한 현재가/전일 종가로 변동률 계산
        result.sox = ((lastClose - prevClose) / prevClose) * 100;
        result.soxPrice = lastClose;
      }
      if(sym.key === "kospi" && typeof lastClose === "number"){
        result.kospi = lastClose;
        result.kospiPrev = prevClose;
        if(typeof high52w === "number" && high52w > lastClose) result.kospi52w = high52w;
      }
    } catch(e) { continue; }
  }

  console.log("✅ Yahoo Chart 결과:", result);
  return (result.vix || result.sox || result.kospi) ? result : null;
}

// Alpha Vantage 호출 (사용자 키 필요)
async function tryAlphaVantage(key){
  try{
    // VIX
    const vixResp = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=VIX&apikey=${key}`);
    const vixData = await vixResp.json();
    const vixQuote = vixData["Global Quote"];

    if(!vixQuote) return null;

    const result = { success: true, source: "Alpha Vantage" };
    const vix = parseFloat(vixQuote["05. price"]);
    if(!isNaN(vix) && vix > 0) result.vix = vix;

    return result;
  } catch(e) {
    console.warn("Alpha Vantage 실패:", e.message);
    return null;
  }
}

// Claude API 호출 (학습 데이터 기반)
async function tryClaudeAPI(apiKey){
  try{
    const today = new Date().toISOString().split("T")[0];
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:300,
        messages:[{role:"user", content:`${today} 기준 최근 거래일 종가 데이터:

⚠️ 중요한 사실:
- 코스피는 2026년 5월 현재 7,500~8,000선입니다 (2024년 박스피 시절 2,000대 아님)
- 52주 최고가도 7,500 이상

다음을 알려주세요:
1. VIX (S&P500 변동성지수 종가, 일반적 10~50)
2. VKOSPI (한국거래소 변동성지수 종가, 일반적 12~40)
3. SOX (필라델피아 반도체지수 일일 변동률 %, -10 ~ +10)
4. KOSPI (코스피 종가, 5000 이상)
5. KOSPI52w (52주 최고가, 7000 이상)

JSON만 출력 (설명 없이):
{"vix":숫자,"vkospi":숫자,"sox":숫자,"kospi":숫자,"kospi52w":숫자}`}]
      })
    });
    const d = await resp.json();
    if(d.error){
      console.warn("Claude API error:", d.error);
      return null;
    }
    // 사용량 추적
    if(d.usage){
      trackApiUsage("claude-sonnet-4-20250514", d.usage.input_tokens || 0, d.usage.output_tokens || 0);
    }
    const txt = d.content?.find(c=>c.type==="text")?.text || "";
    const m = txt.match(/\{[\s\S]*?\}/);
    if(!m) return null;
    const data = JSON.parse(m[0]);

    const result = { success: true, source: "Claude AI" };

    if(typeof data.vix === "number" && data.vix > 5 && data.vix < 100) result.vix = data.vix;
    if(typeof data.vkospi === "number" && data.vkospi > 5 && data.vkospi < 80) result.vkospi = data.vkospi;
    if(typeof data.sox === "number" && Math.abs(data.sox) < 20) result.sox = data.sox;
    if(typeof data.kospi === "number" && data.kospi > 5000 && data.kospi < 30000) result.kospi = data.kospi;
    if(typeof data.kospi52w === "number" && data.kospi52w > 5000) result.kospi52w = data.kospi52w;

    return (result.vix || result.vkospi || result.sox || result.kospi) ? result : null;
  } catch(e) {
    console.warn("Claude API 실패:", e.message);
    return null;
  }
}

// 받아온 데이터 적용
function applyMarketData(data){
  console.log("📊 적용 데이터:", data.source, data);

  if(typeof data.vix === "number" && data.vix > 5 && data.vix < 100){
    const oldVix = S.vix?.value || data.vix;
    const vixRounded = Math.round(data.vix * 10) / 10;  // 소수점 1자리
    const vixPrevRounded = data.vixPrev ? Math.round(data.vixPrev * 10) / 10 : oldVix;
    S.vix = {
      ...S.vix,
      prev: vixPrevRounded,
      value: vixRounded,
      hist: [...(S.vix.hist || []).slice(1), vixRounded],
      at: ts(),
      source: data.source
    };
  }

  if(typeof data.vkospi === "number" && data.vkospi > 5 && data.vkospi < 80){
    const oldVk = S.vkospi?.value || data.vkospi;
    const vkRounded = Math.round(data.vkospi * 10) / 10;
    S.vkospi = {
      ...(S.vkospi || {hist:Array(10).fill(vkRounded)}),
      prev: oldVk,
      value: vkRounded,
      hist: [...(S.vkospi?.hist || Array(9).fill(vkRounded)).slice(1), vkRounded],
      at: ts(),
      source: data.source
    };
  }

  if(typeof data.sox === "number" && Math.abs(data.sox) < 20){
    // 수동 입력 보호: SOX도 수동 입력 후 자동 덮어쓰기 방지
    if(S.sox?.source === "수동 입력" && S.sox?.at){
      const manualAge = Date.now() - new Date(S.sox.at).getTime();
      if(manualAge < 24*60*60*1000){
        console.log("SOX 수동 입력 보호 중 - 자동 갱신 스킵");
        S.sox.at = ts();
        save();
        return;
      }
    }
    const oldSox = S.sox?.value !== undefined ? S.sox.value : data.sox;
    const soxRounded = Math.round(data.sox * 100) / 100;
    S.sox = {
      ...(S.sox || {hist:Array(10).fill(soxRounded)}),
      prev: oldSox,
      value: soxRounded,
      hist: [...(S.sox?.hist || Array(9).fill(soxRounded)).slice(1), soxRounded],
      at: ts(),
      source: data.source
    };
  }

  if(typeof data.kospi === "number" && data.kospi > 5000 && data.kospi < 30000){
    // 수동 입력 보호: 24시간 이내 수동 입력은 자동 덮어쓰기 안 함
    if(S.kospi?.manualLock && S.kospi?.manualAt){
      const manualAge = Date.now() - new Date(S.kospi.manualAt).getTime();
      const hours24 = 24 * 60 * 60 * 1000;
      if(manualAge < hours24){
        console.log("KOSPI 수동 입력 보호 중 — 자동 갱신 스킵");
        // 시각만 갱신
        S.kospi.at = ts();
        save();
        return;
      } else {
        // 24시간 지나면 보호 해제
        delete S.kospi.manualLock;
      }
    }
    const oldKospi = S.kospi?.value || data.kospi;
    const dailyChange = oldKospi > 0 ? Math.abs((data.kospi - oldKospi) / oldKospi) : 0;
    if(dailyChange < 0.15){
      let high = data.kospi52w;
      if(typeof high !== "number" || high < data.kospi){
        high = Math.max(S.kospi?.high52w || data.kospi, data.kospi);
      }

      const lastKospiDate = S.kospi?.at ? new Date(S.kospi.at).toDateString() : "";
      const todayStr = new Date().toDateString();
      const sameDay = (lastKospiDate === todayStr);

      S.kospi = {
        ...(S.kospi || {hist:Array(10).fill(data.kospi)}),
        prev: sameDay ? (S.kospi?.prev || data.kospiPrev || oldKospi) : (data.kospiPrev || oldKospi),
        value: data.kospi,
        high52w: high,
        hist: sameDay
          ? S.kospi?.hist || Array(10).fill(data.kospi)
          : [...(S.kospi?.hist || Array(9).fill(data.kospi)).slice(1), data.kospi],
        at: ts(),
        source: data.source
      };
    }
  }

  save();
}

// API 사용량 기록
function trackApiUsage(model, inputTokens, outputTokens){
  if(!S.apiUsage) S.apiUsage = JSON.parse(JSON.stringify(DEFAULT.apiUsage));
  const now = new Date();
  const monthKey = now.toISOString().substring(0,7);  // "2026-05"
  const dayKey = now.toISOString().substring(0,10);   // "2026-05-22"

  // 모델 분류
  let modelKey;
  if(model.includes("opus")) modelKey = "opus";
  else if(model.includes("sonnet")) modelKey = "sonnet";
  else if(model.includes("haiku")) modelKey = "haiku";
  else modelKey = "other";

  // 월별 누적
  if(!S.apiUsage.monthly[monthKey]) S.apiUsage.monthly[monthKey] = {};
  if(!S.apiUsage.monthly[monthKey][modelKey]){
    S.apiUsage.monthly[monthKey][modelKey] = {calls:0, inTokens:0, outTokens:0};
  }
  const m = S.apiUsage.monthly[monthKey][modelKey];
  m.calls += 1;
  m.inTokens += inputTokens;
  m.outTokens += outputTokens;

  // 일별 누적 (호출 횟수만)
  if(!S.apiUsage.daily[dayKey]) S.apiUsage.daily[dayKey] = {};
  S.apiUsage.daily[dayKey][modelKey] = (S.apiUsage.daily[dayKey][modelKey] || 0) + 1;

  // 30일 이전 일별 데이터는 정리
  const cutoff = new Date(now);
  cutoff.setDate(cutoff.getDate() - 30);
  const cutoffKey = cutoff.toISOString().substring(0,10);
  Object.keys(S.apiUsage.daily).forEach(k => {
    if(k < cutoffKey) delete S.apiUsage.daily[k];
  });

  save();
}

// 비용 계산 (USD)
function calcApiCost(model, inTokens, outTokens){
  // Anthropic 가격표 (per million tokens, 2026.05 기준)
  const prices = {
    sonnet: {input: 3.00, output: 15.00},   // Sonnet 4
    opus:   {input: 15.00, output: 75.00},  // Opus 4.7
    haiku:  {input: 0.80, output: 4.00}
  };
  let key;
  if(model.includes("opus")) key = "opus";
  else if(model.includes("sonnet")) key = "sonnet";
  else if(model.includes("haiku")) key = "haiku";
  else return 0;
  const p = prices[key];
  return (inTokens / 1e6) * p.input + (outTokens / 1e6) * p.output;
}

function getSoxVkospiMatrix(sox, vkospi){

  else if(vkospi < 25) vRow = "중립";
  else if(vkospi < 35) vRow = "공포";
  else vRow = "극도공포";

  let sRow;
  if(sox > 1) sRow = "매수";
  else if(sox > -1) sRow = "보합";
  else sRow = "매도";

  const matrix = {
    "매수": {
      "탐욕": "적극 매수 — 반도체 비중 ↑",
      "중립": "분할 매수 — 목표 비중 확대",
      "공포": "소량 분할 — 2~3회 나눠서",
      "극도공포": "관망 — 역발상 소량만"
    },
    "보합": {
      "탐욕": "현상 유지 — 리밸런싱",
      "중립": "현상 유지 — 포지션 점검",
      "공포": "관망 — 추가 매수 자제",
      "극도공포": "방어 유지 — 손절라인 확인"
    },
    "매도": {
      "탐욕": "익절 검토 — 수익 종목 정리",
      "중립": "부분 익절 20~30%",
      "공포": "손절 검토 — 손실 제한",
      "극도공포": "현금 확보 — MMF 전환"
    }
  };
  return {
    vRow, sRow,
    action: matrix[sRow][vRow]
  };
}

function getCombinedSignal(vix, vkospi){
  const vH = vix >= 25, kH = vkospi >= 25;
  const vL = vix < 20, kL = vkospi < 20;
  if(vH && kH) return "🔥 글로벌·국내 동반 공포 — 분할 매수 적기";
  if(vH && !kH) return "⚠️ 미국발 충격 임박 — 외국인 매도 가능, 신규 매수 보류";
  if(!vH && kH) return "🇰🇷 한국 고유 리스크 — 국내 비중 일부 축소 검토";
  if(vL && kL) return "✅ 양국 모두 안정 — 정상 운용 가능";
  return "🟡 중립 — 현 포지션 유지";
}

/* ── 8. 이벤트 바인딩 ────────────────────────────────── */
function bindEvents(){
  // 모든 data-fn 속성을 찾아 클릭 이벤트 바인딩
  document.querySelectorAll("[data-fn]").forEach(el=>{
    el.addEventListener("click", e => {
      e.stopPropagation();
      const fn = el.getAttribute("data-fn");
      const arg= el.getAttribute("data-arg");
      if(window[fn]) window[fn](arg);
    });
  });
  // 드로어 오버레이 클릭 닫기
  document.querySelectorAll(".overlay").forEach(el=>{
    el.addEventListener("click", e => { if(e.target===el) closeDrawer(); });
  });
}

function closeDrawer(){
  const d=document.getElementById("active-drawer");
  if(d) d.remove();
}

function openDrawer(html){
  closeDrawer();
  const d=document.createElement("div");
  d.id="active-drawer";
  d.innerHTML=`<div class="overlay"><div class="drawer"><div class="dhandle"></div>${html}</div></div>`;
  document.body.appendChild(d);
  d.querySelector(".overlay").addEventListener("click",e=>{if(e.target===d.querySelector(".overlay"))closeDrawer();});
}

window.applyQuickKospi = function(){
  const kospi = parseFloat(document.getElementById("qk-kospi").value);
  const kospiPrev = parseFloat(document.getElementById("qk-prev")?.value);
  const kospiHigh = parseFloat(document.getElementById("qk-high")?.value);

  if(isNaN(kospi) || kospi < 1000){
    alert("올바른 KOSPI 값을 입력하세요 (예: 7940)");
    return;
  }

  // 같은 날 다시 입력하는 경우 prev 보존, 다른 날이면 prev 이동
  const lastKospiDate = S.kospi?.at ? new Date(S.kospi.at).toDateString() : "";
  const todayStr = new Date().toDateString();
  const sameDay = (lastKospiDate === todayStr);

  let high = S.kospi?.high52w || kospi;
  if(!isNaN(kospiHigh) && kospiHigh > 0){
    high = Math.max(high, kospiHigh, kospi);
  } else {
    high = Math.max(high, kospi);
  }

  // 전일 종가 직접 입력 우선, 없으면 자동 처리
  let prevVal;
  if(!isNaN(kospiPrev) && kospiPrev > 1000){
    prevVal = kospiPrev;
  } else if(sameDay){
    prevVal = S.kospi?.prev || kospi;
  } else {
    prevVal = S.kospi?.value || kospi;
  }

  S.kospi = {
    ...(S.kospi || {hist:Array(10).fill(kospi)}),
    prev: prevVal,
    value: kospi,
    high52w: high,
    hist: sameDay
      ? (S.kospi?.hist || Array(10).fill(kospi))
      : [...(S.kospi?.hist || Array(9).fill(kospi)).slice(1), kospi],
    at: ts(),
    source: "수동 입력",
    manualLock: true,  // 수동 입력 보호 마커
    manualAt: ts()
  };
  S.at = ts(); save(); closeDrawer(); renderPage();
};

window.unlockKospiManual = function(){
  if(!S.kospi) return;
  if(!confirm("자동 갱신을 다시 허용할까요?")) return;
  delete S.kospi.manualLock;
  delete S.kospi.manualAt;
  save(); renderPage();
};

window.applyVix = function(){
  const v = parseFloat(document.getElementById("d-vix-val").value);
  const k = parseFloat(document.getElementById("d-vk-val")?.value);
  // SOX 처리 - 종가 두 개 입력 우선, 없으면 % 직접 입력값 사용
  const soxToday = parseFloat(document.getElementById("d-sox-today")?.value);
  const soxPrev = parseFloat(document.getElementById("d-sox-prev")?.value);
  let sox;
  if(!isNaN(soxToday) && !isNaN(soxPrev) && soxPrev > 0){
    // 종가 두 개로 변동률 자동 계산
    sox = ((soxToday - soxPrev) / soxPrev) * 100;
  } else {
    sox = parseFloat(document.getElementById("d-sox-val")?.value);
  }
  if(!isNaN(v) && v > 0){
    S.vix = {...S.vix, prev:S.vix.value, value:v, hist:[...S.vix.hist.slice(1), v], at:ts()};
  }
  if(!isNaN(k) && k > 0){
    S.vkospi = {
      ...(S.vkospi || {prev:k, hist:[k,k,k,k,k,k,k,k,k,k]}),
      prev: S.vkospi?.value || k,
      value: k,
      hist: [...(S.vkospi?.hist || [k,k,k,k,k,k,k,k,k]).slice(1), k],
      at: ts()
    };
  }
  if(!isNaN(sox)){
    const soxR = Math.round(sox * 100) / 100;  // 소수점 2자리 반올림
    S.sox = {
      ...(S.sox || {prev:soxR, hist:Array(10).fill(soxR)}),
      prev: S.sox?.value || soxR,
      value: soxR,
      hist: [...(S.sox?.hist || Array(9).fill(soxR)).slice(1), soxR],
      at: ts(),
      source: "수동 입력"
    };
  }
  const kospi = parseFloat(document.getElementById("d-kospi-val")?.value);
  const kospiHigh = parseFloat(document.getElementById("d-kospi-high")?.value);
  if(!isNaN(kospi) && kospi > 1000){
    const high = (!isNaN(kospiHigh) && kospiHigh > kospi) ? kospiHigh : Math.max(S.kospi?.high52w || kospi, kospi);
    S.kospi = {
      ...(S.kospi || {prev:kospi, hist:[kospi,kospi,kospi,kospi,kospi,kospi,kospi,kospi,kospi,kospi]}),
      prev: S.kospi?.value || kospi,
      value: kospi,
      high52w: high,
      hist: [...(S.kospi?.hist || [kospi,kospi,kospi,kospi,kospi,kospi,kospi,kospi,kospi]).slice(1), kospi],
      at: ts()
    };
  }
  S.at = ts(); save(); closeDrawer(); renderPage();
};

function pageCorrection(){

  const riskFunds = (S.pension.funds||[]).filter(f =>
    ["국내주식","해외주식","대안"].includes(f.type)

  const safeFunds = (S.pension.funds||[]).filter(f =>
    ["채권","원리금보장","기타"].includes(f.type)
  );
  const pensionRisk = riskFunds.reduce((a,f)=>a+(Number(f.amount)||0), 0);
  const pensionSafe = safeFunds.reduce((a,f)=>a+(Number(f.amount)||0), 0);
  const pensionTotal = pensionRisk + pensionSafe;
  const stockTotal = S.stocks.reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.cur)||0), 0);
  const cash = Number(S.cash) || 0;

  // 연금 위험자산 비중
  const pensionRiskPct = pensionTotal > 0 ? (pensionRisk / pensionTotal * 100) : 0;
  const isLocked = pensionRiskPct >= 70;
  const maxRiskAt70 = pensionTotal * 0.7;
  const buyRoomAt70 = Math.max(0, maxRiskAt70 - pensionRisk);

  // ─── KOSPI 실시간 분석 ───
  const kospi = S.kospi?.value || 7643;
  const kospiPrev = S.kospi?.prev || kospi;
  const kospiHigh = S.kospi?.high52w || kospi;
  const dailyChange = kospi - kospiPrev;

      const sox = S.sox?.value || 1.5;

      const signals = [
        {label:"SOX", val:sox+"%", ok: sox > 1.5, mid: sox >= -1 && sox <= 1.5, bad: sox < -1, okLabel:"> +1.5%", badLabel:"< -1%"},

        {label:"VIX", val:v, ok: v < 25, mid: v >= 25 && v <= 30, bad: v > 30, okLabel:"< 25", badLabel:"> 30"},

      ];

      const okCount = signals.filter(s => s.ok).length;
      const badCount = signals.filter(s => s.bad).length;

      let verdict, vColor;
      if(badCount >= 2){ verdict = "🚫 매수 절대 금지"; vColor = "var(--r)"; }

      else { verdict = "⚠️ 추가 신호 대기"; vColor = "var(--y)"; }

      return signals.map(s => {

          </div>
          <div style="font-size:16px;">${icon}</div>
        </div>`;
      }).join("") +
      `<div style="background:${vColor}15;border-left:3px solid ${vColor};border-radius:6px;padding:10px;margin-top:10px;">
        <div style="font-size:10px;color:var(--tx3);margin-bottom:2px;">📌 종합 판단 (가능 ${okCount} · 금지 ${badCount})</div>
        <div style="font-size:13px;font-weight:700;color:${vColor};">${verdict}</div>
      </div>`;
    })()}

  const totalVal  = S.stocks.reduce((a,s)=>a+(Number(s.qty)||0)*(Number(s.cur)||0), 0);
  const totalCost = S.stocks.reduce((a,s)=>a+(Number(s.qty)||0)*(Number(s.avg)||0), 0);
  const totalPL   = totalVal - totalCost;
  const totalPLPct= totalCost>0 ? (totalPL/totalCost*100).toFixed(2) : "0";
  const buyCnt    = S.stocks.filter(s=>s.signal==="buy").length;
  const sellCnt   = S.stocks.filter(s=>s.signal==="sell").length;
  const holdCnt   = S.stocks.filter(s=>s.signal==="hold").length;

  return `
  <div class="sec-hd">
    <div class="sec-title">📈 주식 포트폴리오</div>
    <button class="btn btn-g btn-sm" data-fn="openAddStock">＋ 추가</button>
  </div>

  <div class="card" style="background:linear-gradient(135deg,#0d1828,#111e33);border-color:rgba(79,128,255,.2);margin-bottom:12px;">
    <div style="font-size:11px;color:var(--tx3);margin-bottom:4px;">주식 평가 총액</div>
    <div style="font-size:24px;font-weight:900;font-family:var(--mono);color:var(--acc2);">${B(totalVal)}원</div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;">
      <span style="color:var(--tx3);">매입 ${B(totalCost)}원</span>
      <span class="${totalPL>=0?"up":"dn"}" style="font-weight:700;font-family:var(--mono);">평가손익 ${totalPL>=0?"+":""}${B(totalPL)}원 (${totalPL>=0?"+":""}${totalPLPct}%)</span>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <div style="flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;text-align:center;">
      <div style="font-size:9.5px;color:var(--tx3);margin-bottom:3px;">📈 매수</div>
      <div style="font-size:16px;font-weight:900;font-family:var(--mono);color:var(--g);">${buyCnt}</div>
    </div>
    <div style="flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;text-align:center;">
      <div style="font-size:9.5px;color:var(--tx3);margin-bottom:3px;">⏸️ 보유</div>
      <div style="font-size:16px;font-weight:900;font-family:var(--mono);color:var(--y);">${holdCnt}</div>
    </div>
    <div style="flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;text-align:center;">
      <div style="font-size:9.5px;color:var(--tx3);margin-bottom:3px;">📉 매도</div>
      <div style="font-size:16px;font-weight:900;font-family:var(--mono);color:var(--r);">${sellCnt}</div>
    </div>
    <div style="flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;text-align:center;">
      <div style="font-size:9.5px;color:var(--tx3);margin-bottom:3px;">전체</div>
      <div style="font-size:16px;font-weight:900;font-family:var(--mono);color:var(--tx);">${S.stocks.length}</div>
    </div>
  </div>

  <div class="stamp" style="margin-bottom:12px;"><div class="pulse"></div>조회 ${DT(S.at)}</div>

  ${S.stocks.map(s=>{
    const pl=parseFloat(PL(s.avg,s.cur));
    const val=s.qty*s.cur;
    return `
    <div class="card card-sm" style="margin-bottom:10px;">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <span style="font-weight:900;font-size:14px;">${esc(s.name)}</span>
            <span class="dim" style="font-family:var(--mono);font-size:10px;">${s.ticker}</span>
            ${tag(s.signal)}
          </div>
          <div style="display:flex;gap:14px;font-size:12px;">
            <span style="color:var(--tx3);">수량 <b style="color:var(--tx);font-family:var(--mono);">${N(s.qty)}</b></span>
            <span style="color:var(--tx3);">평균 <b style="color:var(--tx);font-family:var(--mono);">${N(s.avg)}</b></span>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:var(--mono);font-size:16px;font-weight:900;">${N(s.cur)}</div>
          <div class="${pl>=0?"up":"dn"}" style="font-family:var(--mono);font-size:12px;font-weight:700;">${pl>=0?"+":""}${pl}%</div>
          <div class="dim" style="font-size:10px;font-family:var(--mono);">${B(val)}</div>
        </div>
      </div>
      <div class="prog"><div class="prog-f" style="width:${Math.min(Math.abs(pl),30)/30*100}%;background:${pl>=0?"var(--g)":"var(--r)"};"></div></div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="btn btn-g btn-xs" onclick="openEditStock(${s.id})">수정</button>
        <button class="btn btn-rd btn-xs" onclick="delStock(${s.id})">삭제</button>
      </div>
    </div>`;}).join("")}
  ${S.stocks.length===0?`<div class="empty"><div class="empty-ico">📊</div><div>보유 종목 없음</div></div>`:""}`;
}

window.openAddStock = function(){
  openDrawer(`
    <div class="dtitle">📈 종목 추가</div>
    <div class="fg"><label class="fl">📅 매수일</label><input class="fi" type="date" id="s-dt" value="${new Date().toISOString().split("T")[0]}"/></div>
    <div class="fr">
      <div class="fg"><label class="fl">종목코드</label><input class="fi" type="text" id="s-tk" placeholder="005930"/></div>
      <div class="fg"><label class="fl">종목명</label><input class="fi" type="text" id="s-nm" placeholder="삼성전자"/></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">수량</label><input class="fi" type="number" id="s-qty" placeholder="100"/></div>
      <div class="fg"><label class="fl">평균단가</label><input class="fi" type="number" id="s-avg" placeholder="70000"/></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">현재가</label><input class="fi" type="number" id="s-cur" placeholder="75000"/></div>
      <div class="fg"><label class="fl">시그널</label>
        <select class="fs" id="s-sig">
          <option value="buy">매수</option><option value="hold" selected>보유</option><option value="sell">매도</option><option value="watch">관망</option>
        </select>
      </div>
    </div>
    <button class="btn btn-p btn-w" onclick="saveStock()">저장</button>
  `);
};
window.saveStock = function(){
  const name=document.getElementById("s-nm").value.trim();
  if(!name) return;
  S.stocks.push({
    id:Date.now(),
    ticker:document.getElementById("s-tk").value,
    name,
    qty:Number(document.getElementById("s-qty").value)||0,
    avg:Number(document.getElementById("s-avg").value)||0,
    cur:Number(document.getElementById("s-cur").value)||0,
    signal:document.getElementById("s-sig").value,
  });
  S.at=ts(); save(); closeDrawer(); renderPage();
};
window.delStock = id => { S.stocks=S.stocks.filter(x=>x.id!==id); S.at=ts(); save(); renderPage(); };
window.openEditStock = function(id){
  const s=S.stocks.find(x=>x.id===id); if(!s) return;
  openDrawer(`
    <div class="dtitle">✏️ ${esc(s.name)} 수정</div>
    <div class="fg"><label class="fl">📅 수정일</label><input class="fi" type="date" id="e-dt" value="${new Date().toISOString().split("T")[0]}"/></div>
    <div class="fr">
      <div class="fg"><label class="fl">현재가</label><input class="fi" type="number" id="e-cur" value="${s.cur}"/></div>
      <div class="fg"><label class="fl">수량</label><input class="fi" type="number" id="e-qty" value="${s.qty}"/></div>
    </div>
    <div class="fg"><label class="fl">시그널</label>
      <select class="fs" id="e-sig">
        <option value="buy" ${s.signal==="buy"?"selected":""}>매수</option>
        <option value="hold" ${s.signal==="hold"?"selected":""}>보유</option>
        <option value="sell" ${s.signal==="sell"?"selected":""}>매도</option>
        <option value="watch" ${s.signal==="watch"?"selected":""}>관망</option>
      </select>
    </div>
    <button class="btn btn-p btn-w" onclick="updateStock(${id})">저장</button>
  `);
};
window.updateStock = function(id){
  const s=S.stocks.find(x=>x.id===id); if(!s) return;
  s.cur=Number(document.getElementById("e-cur").value)||s.cur;
  s.qty=Number(document.getElementById("e-qty").value)||s.qty;
  s.signal=document.getElementById("e-sig").value;
  S.at=ts(); save(); closeDrawer(); renderPage();
};

/* ══════════════════════════════════════════════════════
   PAGE: 자산 (부동산+차량+현금)
══════════════════════════════════════════════════════ */
let assetTab="re";
function pageAssets(){
  // 자가/임대중: 평가가치 / 전세·월세 거주: 보증금만 (자산)
  const reOwned = S.realestate.filter(r=>!r.ownership || r.ownership==="자가" || r.ownership==="임대중");
  const reRent  = S.realestate.filter(r=>r.ownership==="전세" || r.ownership==="월세");
  const reAssetTotal = reOwned.reduce((a,r)=>a+(Number(r.cur)||0), 0) + reRent.reduce((a,r)=>a+(Number(r.deposit)||0), 0);
  const reCost  = reOwned.reduce((a,r)=>a+(Number(r.buy)||0), 0);
  const rePL    = reOwned.reduce((a,r)=>a+(Number(r.cur)||0)-(Number(r.buy)||0), 0);

  // 임대 내준 부동산의 보증금은 부채 (반환 의무)
  const rentedOutDeposits = S.realestate
    .filter(r=>r.ownership==="임대중")
    .reduce((a,r)=>a+(Number(r.deposit)||0), 0);

  const monthlyTotal = S.realestate.reduce((a,r)=>{
    if(r.ownership==="임대중") return a + (Number(r.monthlyRent)||0);
    if(r.ownership==="월세")   return a - (Number(r.monthlyRent)||0);
    return a;
  }, 0);

  const vhTotal  = S.vehicles.reduce((a,v)=>a+(Number(v.cur)||0), 0);
  const vhCost   = S.vehicles.reduce((a,v)=>a+(Number(v.buy)||0), 0);
  const vhDep    = vhTotal - vhCost;
  const cashTotal= Number(S.cash)||0;

  // 신용대출 등 부채
  const loans = S.loans || [];
  const loanTotal = loans.reduce((a,l)=>a+(Number(l.balance)||0), 0);

  // 총자산 / 총부채 / 순자산
  const grossAssets  = reAssetTotal + vhTotal + cashTotal;
  const totalLiab    = loanTotal + rentedOutDeposits;
  const netWorth     = grossAssets - totalLiab;
  const grandTotal   = netWorth;

  return `
  <div class="sec-hd">
    <div class="sec-title">🏠 자산 관리</div>
    <button class="btn btn-g btn-sm" data-fn="openAddAsset">＋ 추가</button>
  </div>

  <div class="card" style="background:linear-gradient(135deg,#0d1828,#111e33);border-color:rgba(79,128,255,.2);margin-bottom:12px;">
    <div style="font-size:11px;color:var(--tx2);margin-bottom:4px;">순자산 (자산 − 부채)</div>
    <div style="font-size:24px;font-weight:900;font-family:var(--mono);color:${netWorth>=0?'var(--acc2)':'var(--r)'};">${B(netWorth)}원</div>
    <div style="display:flex;gap:14px;margin-top:8px;font-size:11px;">
      <span style="color:var(--tx2);">총자산 <b style="color:var(--g);font-family:var(--mono);">${B(grossAssets)}</b></span>
      <span style="color:var(--tx2);">총부채 <b style="color:var(--r);font-family:var(--mono);">${B(totalLiab)}</b></span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
    <div style="background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px;border-top:2px solid var(--g);">
      <div style="font-size:9.5px;color:var(--tx2);margin-bottom:3px;">🏠 부동산</div>
      <div style="font-size:14px;font-weight:900;font-family:var(--mono);color:var(--g);">${B(reAssetTotal)}</div>
      <div style="font-size:9px;color:var(--tx2);margin-top:2px;">자가 ${reOwned.length} · 임차 ${reRent.length}</div>
      ${monthlyTotal!==0?`<div style="font-size:9px;color:${monthlyTotal>0?"var(--g)":"var(--r)"};margin-top:1px;">월 ${monthlyTotal>0?"+":""}${B(monthlyTotal)}</div>`:""}
    </div>
    <div style="background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px;border-top:2px solid var(--p);">
      <div style="font-size:9.5px;color:var(--tx2);margin-bottom:3px;">🚗 차량</div>
      <div style="font-size:14px;font-weight:900;font-family:var(--mono);color:var(--p);">${B(vhTotal)}</div>
      <div style="font-size:9px;color:var(--tx2);margin-top:2px;">감가 <span class="dn">${B(vhDep)}</span></div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
    <div style="background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px;border-top:2px solid var(--acc2);">
      <div style="font-size:9.5px;color:var(--tx2);margin-bottom:3px;">💵 현금</div>
      <div style="font-size:14px;font-weight:900;font-family:var(--mono);color:var(--acc2);">${B(cashTotal)}</div>
      <div style="font-size:9px;color:var(--tx2);margin-top:2px;">예금/적금 합산</div>
    </div>
    <div style="background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px;border-top:2px solid var(--r);">
      <div style="font-size:9.5px;color:var(--tx2);margin-bottom:3px;">💳 부채</div>
      <div style="font-size:14px;font-weight:900;font-family:var(--mono);color:var(--r);">${B(totalLiab)}</div>
      <div style="font-size:9px;color:var(--tx2);margin-top:2px;">대출 ${loans.length} · 임대보증금 ${rentedOutDeposits>0?B(rentedOutDeposits):"0"}</div>
    </div>
  </div>
  <div class="tabs-row">
    <div class="tab-pill ${assetTab==="re"?"on":""}" onclick="setAssetTab('re')">🏠 부동산</div>
    <div class="tab-pill ${assetTab==="vh"?"on":""}" onclick="setAssetTab('vh')">🚗 차량</div>
    <div class="tab-pill ${assetTab==="cash"?"on":""}" onclick="setAssetTab('cash')">💵 현금</div>
    <div class="tab-pill ${assetTab==="loan"?"on":""}" onclick="setAssetTab('loan')">💳 대출</div>
  </div>
  <div id="asset-body">${renderAssetBody()}</div>`;
}
window.setAssetTab = t => { assetTab=t; const el=document.getElementById("asset-body"); if(el) el.innerHTML=renderAssetBody(); };

function renderAssetBody(){
  if(assetTab==="loan"){
    const loans = S.loans || [];
    if(loans.length === 0){
      return `<div class="empty"><div class="empty-ico">💳</div><div>등록된 대출 없음</div><div style="font-size:11px;color:var(--tx3);margin-top:6px;">＋ 추가 버튼으로 신용대출/주담대/마이너스통장 등 등록</div></div>`;
    }
    return loans.map(l=>{
      const monthlyInt = Math.round((Number(l.balance)||0) * (Number(l.rate)||0)/100/12);
      const typeColor = {"신용대출":"#fb923c","주택담보대출":"#a78bfa","마이너스통장":"#f87171","기타":"#7088aa"}[l.type] || "#7088aa";
      return `<div class="card card-sm" style="margin-bottom:10px;border-left:3px solid var(--r);">
        <div style="display:flex;align-items:flex-start;margin-bottom:8px;">
          <div style="flex:1;">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
              <b style="font-size:13px;">${esc(l.name)}</b>
              <span style="background:${typeColor}22;color:${typeColor};border:1px solid ${typeColor}44;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">${l.type||"기타"}</span>
            </div>
            <div style="font-size:11px;color:var(--tx2);">잔액 <b style="color:var(--r);font-family:var(--mono);">${B(l.balance)}원</b></div>
            <div style="font-size:11px;color:var(--tx2);">금리 <b style="color:var(--y);font-family:var(--mono);">${l.rate||0}%</b> · 월이자 약 <b style="color:var(--r);font-family:var(--mono);">${B(monthlyInt)}원</b></div>
            ${l.dueDate ? `<div style="font-size:11px;color:var(--tx2);">만기 ${l.dueDate}</div>` : ""}
          </div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-g btn-xs" style="flex:1;" onclick="editLoan(${l.id})">✏️ 수정</button>
          <button class="btn btn-rd btn-xs" style="flex:1;" onclick="delLoan(${l.id})">🗑️ 삭제</button>
        </div>
      </div>`;
    }).join("");
  }
  if(assetTab==="re") return S.realestate.map((r,i)=>{
    const pl = parseFloat(PL(r.buy||0, r.cur||0));
    const own = r.ownership || "자가";
    const ownColor = {"자가":"#34d399","전세":"#7eb8ff","월세":"#fbbf24","임대중":"#a78bfa"}[own] || "#7a99cc";
    const isOwned = own==="자가" || own==="임대중";
    return `<div class="card card-sm" style="margin-bottom:10px;">
      <div style="display:flex;align-items:flex-start;margin-bottom:8px;">
        <div style="flex:1;">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
            <b style="font-size:13px;">${esc(r.name)}</b>
            <span style="background:${ownColor}22;color:${ownColor};border:1px solid ${ownColor}44;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">${own}</span>
            <span style="font-size:10px;color:var(--tx2);">${r.type||"기타"}</span>
            ${tag(r.signal)}
          </div>
          ${isOwned ? `
            <div style="font-size:11px;color:var(--tx2);">취득 ${B(r.buy)}원 → 현재 ${B(r.cur)}원</div>
            ${own==="임대중" && r.deposit ? `<div style="font-size:11px;color:var(--tx2);">임대 보증금 <b style="color:var(--r);">-${B(r.deposit)}원</b> <span style="font-size:9px;color:var(--r);">(부채)</span>${r.monthlyRent?` · 월세 ${B(r.monthlyRent)}원`:""}</div>` : ""}
            <div style="font-size:11px;color:var(--tx2);">임대수익률 <span style="color:var(--g);font-weight:700;">${r.ryd||0}%</span></div>
          ` : own==="전세" ? `
            <div style="font-size:11px;color:var(--tx2);">전세 보증금 <b style="color:var(--acc2);">${B(r.deposit||0)}원</b></div>
            <div style="font-size:11px;color:var(--tx2);">계약기간 ${r.contractStart||"-"} ~ ${r.contractEnd||"-"}</div>
          ` : `
            <div style="font-size:11px;color:var(--tx2);">월세 보증금 <b style="color:var(--acc2);">${B(r.deposit||0)}원</b></div>
            <div style="font-size:11px;color:var(--tx2);">월세 <b style="color:var(--y);">${B(r.monthlyRent||0)}원</b></div>
          `}
        </div>
        ${isOwned ? `<div style="text-align:right;">
          <div class="${pl>=0?"up":"dn"}" style="font-size:17px;font-weight:900;font-family:var(--mono);">${pl>=0?"+":""}${pl}%</div>
          <div style="font-size:10px;font-family:var(--mono);color:var(--tx2);">${pl>=0?"+":""}${B((r.cur||0)-(r.buy||0))}</div>
        </div>` : ""}
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-g btn-xs" style="flex:1;" onclick="editRE(${r.id})">✏️ 수정</button>
        <button class="btn btn-rd btn-xs" style="flex:1;" onclick="delRE(${r.id})">🗑️ 삭제</button>
      </div>
    </div>`}).join("")+
    (S.realestate.length===0?`<div class="empty"><div class="empty-ico">🏠</div><div>부동산 없음</div></div>`:"");

  if(assetTab==="vh") return S.vehicles.map(v=>{
    const dep=parseFloat(PL(v.buy,v.cur));
    const rat=((v.cur/v.buy)*100).toFixed(0);
    return `<div class="card card-sm" style="margin-bottom:10px;">
      <div style="display:flex;align-items:flex-start;">

let inputTab="upload-stock";

// 날짜 입력 헬퍼: 빠른 연/월 선택 + 텍스트 입력
function dateInputHtml(id, defaultVal){
  const d = defaultVal ? new Date(defaultVal) : new Date();
  const yr = d.getFullYear();
  const mo = String(d.getMonth()+1).padStart(2,"0");
  const dy = String(d.getDate()).padStart(2,"0");
  const yearOpts = [];
  const curYear = new Date().getFullYear();
  for(let y=curYear+5; y>=curYear-50; y--) yearOpts.push(y);
  return `
    <div class="date-picker" data-id="${id}">
      <div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:5px;margin-bottom:5px;">
        <select class="fs" id="${id}-y" onchange="updateDate('${id}')" style="padding:9px 8px;font-size:13px;">
          ${yearOpts.map(y=>`<option value="${y}" ${y==yr?"selected":""}>${y}년</option>`).join("")}
        </select>
        <select class="fs" id="${id}-m" onchange="updateDate('${id}')" style="padding:9px 8px;font-size:13px;">
          ${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${String(m).padStart(2,"0")}" ${String(m).padStart(2,"0")==mo?"selected":""}>${m}월</option>`).join("")}
        </select>
        <select class="fs" id="${id}-d" onchange="updateDate('${id}')" style="padding:9px 8px;font-size:13px;">
          ${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${String(d).padStart(2,"0")}" ${String(d).padStart(2,"0")==dy?"selected":""}>${d}일</option>`).join("")}
        </select>
      </div>
      <input class="fi" type="text" id="${id}" value="${defaultVal||""}" placeholder="YYYY-MM-DD" style="font-family:var(--mono);font-size:13px;text-align:center;"/>
    </div>`;
}

window.updateDate = function(id){
  const y = document.getElementById(id+"-y").value;
  const m = document.getElementById(id+"-m").value;
  const d = document.getElementById(id+"-d").value;
  const inp = document.getElementById(id);
  if(inp) inp.value = `${y}-${m}-${d}`;
};

window.getDateValue = function(id){
  const inp = document.getElementById(id);
  return inp ? inp.value : "";
};

/* ── AI 분석 (CORS 우회: 분석 단계별 표시) ── */
/* 이미지 리사이즈 — 한국어 텍스트 가독성 우선 + 8000px 한도 회피
   - 한 변 최대 5000px (텍스트 OCR 적정 크기)
   - JPEG 95% 고품질 (글자 뭉개짐 방지)
   - 다단계 축소 (Lanczos 흉내) */
async function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width: srcW, height: srcH } = img;
      const original = `${srcW}×${srcH}`;
      let targetW = srcW, targetH = srcH;

      if(srcW > maxDim || srcH > maxDim){
        if(srcW > srcH){
          targetH = Math.round(srcH * maxDim / srcW);
          targetW = maxDim;
        } else {
          targetW = Math.round(srcW * maxDim / srcH);
          targetH = maxDim;
        }
      }

      // 다단계 축소 — 한 번에 50% 이하로 줄이지 않음 (글자 깨짐 방지)
      let curW = srcW, curH = srcH;
      let curCanvas = document.createElement("canvas");
      curCanvas.width = curW;
      curCanvas.height = curH;
      curCanvas.getContext("2d").drawImage(img, 0, 0);

      while(curW > targetW * 2){
        const nextW = Math.max(targetW, Math.round(curW / 2));
        const nextH = Math.max(targetH, Math.round(curH / 2));
        const nextCanvas = document.createElement("canvas");
        nextCanvas.width = nextW;
        nextCanvas.height = nextH;
        const nctx = nextCanvas.getContext("2d");
        nctx.imageSmoothingEnabled = true;
        nctx.imageSmoothingQuality = "high";
        nctx.drawImage(curCanvas, 0, 0, nextW, nextH);
        curCanvas = nextCanvas;
        curW = nextW;
        curH = nextH;
      }

      // 최종 크기로
      const finalCanvas = document.createElement("canvas");
      finalCanvas.width = targetW;
      finalCanvas.height = targetH;
      const fctx = finalCanvas.getContext("2d");
      fctx.imageSmoothingEnabled = true;
      fctx.imageSmoothingQuality = "high";
      fctx.drawImage(curCanvas, 0, 0, targetW, targetH);

      const dataUrl = finalCanvas.toDataURL("image/jpeg", quality);
      const b64 = dataUrl.split(",")[1];
      URL.revokeObjectURL(url);
      const sizeKB = Math.round(b64.length * 0.75 / 1024);
      const info = original !== `${targetW}×${targetH}` ? `(${original} → ${targetW}×${targetH}, ${sizeKB}KB)` : `(${sizeKB}KB)`;
      resolve({ b64, info, width: targetW, height: targetH });
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("이미지 로드 실패"));
    };
    img.src = url;
  });
}

        <div class="ai-box" style="margin-top:14px;border-left:3px solid var(--y);">
          <div style="font-weight:700;color:var(--y);margin-bottom:8px;">⚠️ AI 응답 파싱 실패</div>
          <div style="font-size:11px;color:var(--tx2);margin-bottom:8px;line-height:1.6;">
            가능한 원인:<br>
            • 사진이 흐려서 텍스트 인식 실패<br>
            • 종목 수가 너무 많아 응답 길이 초과<br>
            • API 일시적 오류
          </div>
          <details style="font-size:10px;color:var(--tx3);margin-bottom:10px;">
            <summary style="cursor:pointer;">AI 응답 보기 (디버그)</summary>
            <pre style="background:var(--s2);padding:8px;border-radius:6px;overflow-x:auto;font-size:9.5px;margin-top:6px;max-height:200px;">${esc(txt.substring(0,500))}</pre>
          </details>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-p" style="flex:1;" onclick="analyzePhoto()">🔄 다시 분석</button>
            <button class="btn btn-g btn-sm" onclick="manualFromPhoto()">✏️ 수동</button>
          </div>
        </div>`;
      return;
    }

    if(!Array.isArray(items)) items = [items];

    if(items.length === 0){
      res.innerHTML = `
        <div class="ai-box" style="margin-top:14px;border-left:3px solid var(--y);">
          <div style="font-weight:700;color:var(--y);margin-bottom:8px;">⚠️ 추출된 항목 없음</div>
          <div style="font-size:11px;color:var(--tx2);margin-bottom:10px;">사진에서 종목을 인식하지 못했습니다.</div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-p" style="flex:1;" onclick="analyzePhoto()">🔄 다시 분석</button>
            <button class="btn btn-g btn-sm" onclick="manualFromPhoto()">✏️ 수동</button>
          </div>
        </div>`;
      return;
    }

    lastAnalyzed = items;

    // 분석 결과 + 각 항목별 저장 버튼 표시
    res.innerHTML = `
      <div class="ai-box" style="margin-top:14px;border:1px solid rgba(52,211,153,.3);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <span style="font-size:20px;">✅</span>
          <span style="font-size:14px;font-weight:700;color:var(--g);">분석 완료 — ${items.length}개 항목 추출</span>

        ${items.map((it,i)=>renderAnalyzedItem(it,i,photoTarget)).join("")}

      </div>`;

        <div style="font-size:11px;color:var(--tx3);margin-bottom:12px;">${esc(e.message||String(e))}</div>
        <button class="btn btn-p btn-w" onclick="manualFromPhoto()">✏️ 수동 입력</button>
      </div>`;
  }
};

function renderAnalyzedItem(it, i, target){
  if(target==="stock"){
    const pl = it.avg && it.cur ? (((it.cur-it.avg)/it.avg)*100).toFixed(1) : "0";
    const total = (Number(it.qty)||0) * (Number(it.cur)||0);
    // 비정상 검출: qty>50만 OR 평가가치>100억 OR avg=cur으로 동일하면서 큰값
    const isAbnormal = (Number(it.qty)||0) > 500000 || total > 1e10 ||
                       (Number(it.avg) === Number(it.cur) && Number(it.cur) > 1000000 && Number(it.qty) > 1);
    const isCash = /^(현금|예수금|국내\s?현금|USD\s?현금|cash|usd)$/i.test((it.name||"").trim());
    return `
    <div style="background:var(--s2);border-radius:8px;padding:12px;margin-bottom:8px;${isAbnormal?'border:2px solid var(--r);':isCash?'opacity:0.5;border:1px dashed var(--y);':''}">
      ${isAbnormal ? `<div style="background:rgba(248,113,113,.18);color:var(--r);border-radius:4px;padding:5px 8px;font-size:11px;margin-bottom:8px;font-weight:700;">⚠️ AI가 컬럼 잘못 매칭한 듯 — 수정 필요!</div>` : ''}
      ${isCash ? `<div style="background:rgba(251,191,36,.15);color:var(--y);border-radius:4px;padding:4px 8px;font-size:11px;margin-bottom:8px;font-weight:700;">ℹ️ 종목 아님 (저장 시 자동 제외)</div>` : ''}
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px;">
        <div>
          <b style="font-size:13px;">${esc(it.name||"종목명 미확인")}</b>
          ${it.ticker?`<span style="font-size:10px;color:var(--tx2);font-family:var(--mono);margin-left:6px;">${esc(it.ticker)}</span>`:""}
        </div>
        <span class="${pl>=0?"up":"dn"}" style="font-size:13px;font-weight:700;font-family:var(--mono);white-space:nowrap;">${pl>=0?"+":""}${pl}%</span>
      </div>
      <div style="display:flex;gap:10px;font-size:11px;color:var(--tx2);margin-bottom:6px;">
        <span>수량 <b style="color:${isAbnormal?'var(--r)':'var(--tx)'};font-family:var(--mono);">${N(it.qty||0)}</b></span>
        <span>평균 <b style="color:var(--tx);font-family:var(--mono);">${N(it.avg||0)}</b></span>
        <span>현재 <b style="color:var(--tx);font-family:var(--mono);">${N(it.cur||0)}</b></span>
      </div>
      <div style="font-size:11px;color:var(--tx2);">평가금액: <b style="color:${isAbnormal?'var(--r)':'var(--g)'};font-family:var(--mono);font-size:13px;">${N(total)}원</b></div>
      <button onclick="editAnalyzedItem(${i})" style="margin-top:8px;width:100%;padding:8px;background:${isAbnormal?'var(--r)':'transparent'};border:1px solid var(--b2);color:${isAbnormal?'#fff':'var(--tx2)'};border-radius:6px;font-size:11px;cursor:pointer;font-weight:${isAbnormal?700:400};">${isAbnormal?'⚠️ 수정 필요 — 클릭':'✏️ 수정'}</button>
    </div>`;
  } else {
    const isAbnormalP = (Number(it.amount)||0) === 0 || (Number(it.amount)||0) > 1e10;
    const nameEsc = esc(it.name||"").replace(/"/g, "&quot;");
    return `
    <div style="background:var(--s2);border-radius:8px;padding:12px;margin-bottom:8px;${isAbnormalP?'border:2px solid var(--r);':''}" data-idx="${i}">
      ${isAbnormalP ? '<div style="background:rgba(248,113,113,.15);color:var(--r);border-radius:4px;padding:4px 8px;font-size:11px;margin-bottom:8px;font-weight:700;">⚠️ 금액 확인 필요</div>' : ''}
      <input type="text" id="inline-name-${i}" value="${nameEsc}"
        oninput="updateAnalyzedField(${i}, 'name', this.value)"
        style="width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:4px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--tx);margin-bottom:8px;box-sizing:border-box;"/>
      <div style="display:grid;grid-template-columns:1.1fr 1.4fr 0.9fr;gap:6px;margin-bottom:8px;">
        <select id="inline-type-${i}" onchange="updateAnalyzedField(${i}, 'type', this.value)"
          style="background:var(--s1);border:1px solid var(--b1);border-radius:4px;padding:6px 4px;font-size:11px;color:var(--tx);">
          <option ${it.type==='국내주식'?'selected':''}>국내주식</option>
          <option ${it.type==='해외주식'?'selected':''}>해외주식</option>
          <option ${it.type==='채권'?'selected':''}>채권</option>
          <option ${it.type==='원리금보장'?'selected':''}>원리금보장</option>
          <option ${it.type==='대안'?'selected':''}>대안</option>
          <option ${it.type==='기타'?'selected':''}>기타</option>
        </select>
        <input type="number" id="inline-amount-${i}" value="${it.amount||0}"
          oninput="updateAnalyzedField(${i}, 'amount', Number(this.value)||0)"
          placeholder="평가금액"
          style="width:100%;background:var(--s1);border:1px solid ${isAbnormalP?'var(--r)':'var(--b1)'};border-radius:4px;padding:6px 8px;font-size:11px;font-family:var(--mono);color:${isAbnormalP?'var(--r)':'var(--g)'};font-weight:700;box-sizing:border-box;"/>
        <input type="number" step="0.01" id="inline-ytd-${i}" value="${it.ytd||0}"
          oninput="updateAnalyzedField(${i}, 'ytd', Number(this.value)||0)"
          placeholder="%"
          style="width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:4px;padding:6px 8px;font-size:11px;font-family:var(--mono);color:${(it.ytd||0)>=0?'var(--g)':'var(--r)'};font-weight:700;box-sizing:border-box;"/>
      </div>
      <button onclick="removeAnalyzedItem(${i})"
        style="width:100%;padding:4px;background:transparent;border:1px solid rgba(248,113,113,.3);color:var(--r);border-radius:4px;font-size:10px;cursor:pointer;">
        🗑️ 이 항목 제외
      </button>
    </div>`;
  }
}

window.updateAnalyzedField = function(idx, field, value){
  const data = window.lastAnalyzed || lastAnalyzed;
  if(!data || !data[idx]) return;
  data[idx][field] = value;
};

window.removeAnalyzedItem = function(idx){
  const data = window.lastAnalyzed || lastAnalyzed;
  if(!data) return;
  if(!confirm("이 항목을 추출 결과에서 제외할까요?")) return;
  data.splice(idx, 1);
  redrawAnalyzedResults();
};

window.addAnalyzedItem = function(){
  if(!window.lastAnalyzed) window.lastAnalyzed = [];
  const target = window.photoTarget || photoTarget;
  if(target==="pension"){
    window.lastAnalyzed.push({name:"새 펀드", type:"국내주식", amount:0, ytd:0});
  } else {
    window.lastAnalyzed.push({name:"새 종목", ticker:"", qty:0, avg:0, cur:0});
  }
  redrawAnalyzedResults();
};

function redrawAnalyzedResults(){
  const res = document.getElementById("photo-result");
  const data = window.lastAnalyzed || lastAnalyzed;
  if(!res || !data) return;
  res.innerHTML = '<div class="ai-box" style="margin-top:14px;border:1px solid rgba(52,211,153,.3);">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
    '<span style="font-size:20px;">✅</span>' +
    '<span style="font-size:14px;font-weight:700;color:var(--g);">분석 결과 — ' + data.length + '개</span>' +
    '</div>' +
    '<button onclick="addAnalyzedItem()" style="padding:4px 10px;background:var(--acc);color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer;font-weight:700;">＋ 항목 추가</button>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--tx2);margin-bottom:10px;line-height:1.6;padding:8px 10px;background:rgba(79,128,255,.08);border-radius:6px;">' +
    '💡 <b>금액·수익률·종목명을 직접 클릭해서 수정</b>하세요. 빨간색은 비정상 항목.' +
    '</div>' +
    data.map((it,i)=>renderAnalyzedItem(it,i,window.photoTarget||photoTarget)).join("") +
    '<button class="btn btn-p btn-w" style="margin-top:12px;" onclick="saveAllAnalyzed()">💾 모두 저장 (' + data.length + '개)</button>' +
    '</div>';
}

        <div class="fg"><label class="fl">수량</label><input class="fi" type="number" id="ed-qty" value="${it.qty||0}"/></div>

      </div>
      <div class="fr">

          <select class="fs" id="ed-type">
            <option ${it.type==="국내주식"?"selected":""}>국내주식</option>
            <option ${it.type==="해외주식"?"selected":""}>해외주식</option>

window.saveEditedItem = function(idx){
  const it = lastAnalyzed[idx];
  if(!it) return;
  if(photoTarget==="stock"){
    it.qty = Number(document.getElementById("ed-qty").value)||0;
    it.avg = Number(document.getElementById("ed-avg").value)||0;
    it.cur = Number(document.getElementById("ed-cur").value)||0;
  } else {
    it.amount = Number(document.getElementById("ed-amt").value)||0;
    it.ytd = Number(document.getElementById("ed-ytd").value)||0;
    it.type = document.getElementById("ed-type").value;
